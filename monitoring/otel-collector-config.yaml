# OpenTelemetry Collector pipeline:
#   creed-author-server  --OTLP/HTTP-->  collector
#     - traces  -> Tempo  (OTLP gRPC)
#     - logs    -> Loki   (OTLP HTTP)
#     - metrics -> Prometheus scrape on :8889 (collector exposes /metrics)
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128
  resource:
    attributes:
      - key: collector
        value: creed-otel-collector
        action: insert

exporters:
  # Tempo accepts native OTLP gRPC on 4317
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Loki accepts OTLP logs on its HTTP endpoint
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  # Prometheus pulls metrics from /metrics on :8889
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/loki]
  telemetry:
    logs:
      level: info