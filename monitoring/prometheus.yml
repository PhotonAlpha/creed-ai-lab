global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Pull-mode metrics: Micrometer Prometheus registry on the auth-server.
#  - job_name: creed-author-server
#    metrics_path: /auth-server/actuator/prometheus
#    static_configs:
#      - targets:
#          - host.docker.internal:9000
#        labels:
#          application: creed-author-server

  # Push-mode metrics: OTLP -> Collector -> Prometheus exporter on :8889.
  # The auth-server's Micrometer metrics now arrive via this OTLP pipeline, so the
  # direct /auth-server/actuator/prometheus scrape is disabled.
  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889
        labels:
          source: otel