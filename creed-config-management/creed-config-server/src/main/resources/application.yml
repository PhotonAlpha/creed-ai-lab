server:
  port: 8443
  servlet:
    context-path: /config-server

spring:
  # Jackson 3 (Boot 4) changed defaults the APIs were written against - e.g. FAIL_ON_NULL_FOR_PRIMITIVES
  # is on, so a body omitting a boolean field is a 400. Keep Jackson 2's until each API is reviewed.
  jackson:
    use-jackson2-defaults: true
  application:
    name: creed-config-server
  # `native` makes Spring Cloud Config serve from classpath:/config-repo/.
  # `ssl` pulls in application-ssl.yml (embedded Tomcat HTTPS + SSL Bundles).
  # Tests use @ActiveProfiles({"native","test"}) to skip the ssl profile so the
  # context loads without real certs on disk.
  profiles:
    active: native,ssl
  cloud:
    config:
      server:
        # Six layers, lowest precedence first — LATER LOCATIONS WIN (config-repo/README.md):
        #   common → type → env-group → env → app → app-env
        # A client asks for  GET /{application}/{type},{env-group},{env}  (e.g.
        # /creed-resource-order/ms,sit,sit1). The server expands {profile} with EACH of those three
        # values in every location, layer by layer, and keeps the directories that exist — so
        # type/ms/ exists and type/sit/ does not. Each layer directory holds one application.yml.
        native:
          search-locations:
            - ${creed.config-repo.root}/common/
            - ${creed.config-repo.root}/type/{profile}/
            - ${creed.config-repo.root}/env-group/{profile}/
            - ${creed.config-repo.root}/env/{profile}/
            - ${creed.config-repo.root}/app/{application}/
            - ${creed.config-repo.root}/app-env/{application}/{profile}/
          # Otherwise every location is also tried with /{label}/ (master/) appended.
          add-label-locations: false
    discovery:
      client:
        simple:
          instances:
            # Ports must match the resource servers' primary/secondary (root CLAUDE.md port table);
            # they were left on the pre-migration 808x/809x values when those moved to 1808x/1809x.
            catalog-cluster:
              - uri: https://localhost:18081
                metadata:
                  zone: zone1
              - uri: https://localhost:18082
                metadata:
                  zone: zone2
            order-cluster:
              - uri: https://localhost:18091
                metadata:
                  zone: zone1
              - uri: https://localhost:18092
                metadata:
                  zone: zone2

  security:
    user:
      name: ${CREED_CONFIG_USER:creed-config}
      password: ${CREED_CONFIG_PASSWORD:configpass}
      roles: CONFIG_CLIENT

# =============================================================================
# Requirement 6: asymmetric ({cipher}) decryption.
# -----------------------------------------------------------------------------
# Properties served from config-repo may store secrets as `{cipher}<base64>`,
# encrypted with the RSA *public* key in this key-store. The config server holds
# the matching *private* key and decrypts them transparently before serving, so
# clients (creed-resource-catalog / -order) only ever receive plaintext.
#
# Encrypt a new value with:
#   curl -k -u creed-config:configpass https://localhost:8443/config-server/encrypt -d 'changeit'
# (requires spring-security-rsa + bouncycastle, declared in this module's pom).
encrypt:
  key-store:
    location: classpath:certs/config-encrypt.p12
    type: PKCS12
    alias: ${CREED_ENCRYPT_ALIAS:config-key}
    password: ${CREED_ENCRYPT_STORE_PASSWORD:changeit}
    secret: ${CREED_ENCRYPT_KEY_PASSWORD:changeit}

# Used by HttpClientsConfiguration to pick which bundle the outbound
# RestTemplate / RestClient should use. Swap to "creed-jks-client" if your
# certs are distributed as JKS / PKCS12 instead of PEM.
creed:
  config-repo:
    # The layered repository. Point it at a checkout to edit config without rebuilding the jar,
    # e.g. CREED_CONFIG_REPO_ROOT=file:/opt/creed/config-repo (no trailing slash).
    root: ${CREED_CONFIG_REPO_ROOT:classpath:/config-repo}
  # Requirement 1: programmatic embedded-Tomcat HTTPS (TomcatHttpsConfiguration).
  # Tests set creed.https.enabled=false to load the context without certs on disk.
  https:
    enabled: true
    bundle: creed-pem-server
  http-client:
    enabled: true
    ssl-bundle: creed-pem-client
    connect-timeout: 5s
    read-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,configprops,sslbundles
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    env:
      show-values: always
    configprops:
      show-values: always
      roles: ADMIN

# =============================================================================
# JWS (Red Hat JBoss Web Server) deployment notes
# -----------------------------------------------------------------------------
# 1. Build:           mvn -pl creed-config-server -am clean package
# 2. Drop the war:    $JWS_HOME/tomcat/webapps/creed-config-server.war
# 3. Configure the HTTPS connector in $JWS_HOME/tomcat/conf/server.xml, e.g.
#    <Connector port="8443" protocol="org.apache.coyote.http11.Http11Nio2Protocol"
#               SSLEnabled="true" maxThreads="200" scheme="https" secure="true">
#      <SSLHostConfig protocols="TLSv1.3,TLSv1.2">
#        <Certificate certificateKeystoreFile="conf/server-keystore.p12"
#                     certificateKeystorePassword="changeit"
#                     type="RSA"/>
#      </SSLHostConfig>
#    </Connector>
# 4. The `spring.ssl.bundle.*` blocks in application-ssl.yml STILL apply for
#    outbound RestTemplate / RestClient calls (creed-pem-client / creed-jks-client)
#    when deployed to JWS — only `server.ssl.*` is bypassed because the container
#    owns the listener.
# =============================================================================

# =============================================================================
# Generating the dev PKI referenced above
# -----------------------------------------------------------------------------
#  pwsh creed-config-server/scripts/generate-certs.ps1
#    [-Force]                                  # overwrite existing
#    [-Password changeit]                      # keystore/truststore password
#    [-ValidityDays 365]                       # cert lifetime
#    [-ServerCn localhost]                     # server CN
#    [-ServerSan @('DNS:localhost','IP:127.0.0.1')]  # server SANs
#
# Drops ca.crt / server.{crt,key} / client.{crt,key} / *-keystore.p12 / truststore.p12
# into src/main/resources/certs/, matching every path referenced in the bundles above.
# Requires OpenSSL 3.x and the JDK's keytool on PATH.
# =============================================================================
