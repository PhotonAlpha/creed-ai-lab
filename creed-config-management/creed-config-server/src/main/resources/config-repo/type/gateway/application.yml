# Layer 2/6 — type `gateway`: the edge gateways (creed-gateway, creed-gateway-partner).
creed:
  config:
    layer: type
    layers:
      type: gateway
  http:
    connect-timeout: 3s
    read-timeout: 30s
  gateway:
    # Edge-facing: a slow downstream must not hold a gateway thread forever.
    downstream-response-timeout: 15s

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${creed.env.auth-issuer}
