<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${current != null} ? ${current.right} + ' — ' + #{diff.title} : #{diff.title}">Migration risk diff</title>
    <!-- The same assets RefactoringMiner's own web diff loads; its scripts and CSS are served from its jar. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/api/migration-risk/view/assets/monaco.css}">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; }
        .mr-bar { display: flex; align-items: center; gap: 12px; padding: 4px 8px; flex-wrap: wrap; }
        .mr-bar .spacer { flex: 1; }
        .mr-files { display: flex; font-weight: 500; border-bottom: 1px solid #dee2e6; }
        .mr-files > div { width: 50%; padding: 2px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .mr-editors { display: flex; height: calc(100% - 76px); }
        .mr-editors > div { width: 50%; height: 100%; border-right: 1px solid #dee2e6; }
        .mr-legend span { display: inline-block; padding: 0 6px; margin: 2px 4px 2px 0; }
        .mr-overview { max-height: 60vh; overflow: auto; }
    </style>
</head>
<body>
<div class="mr-bar">
    <span>
        <span th:text="#{diff.generated}">Generated by RefactoringMiner</span> |
        <strong th:text="#{diff.side}">repo1 vs repo2</strong>
        <span class="text-muted" th:if="${refactoringCount != null}"
              th:text="#{diff.refactorings(${refactoringCount})}">2 refactorings</span>
    </span>
    <span class="spacer"></span>
    <div class="btn-group btn-group-sm" role="group" th:if="${current != null}">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#legend"
                th:text="#{diff.legend}">Legend</button>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#overview"
                th:text="#{diff.overview}">Overview</button>
        <a class="btn btn-primary" th:classappend="${prev == null} ? 'disabled'" th:href="${prev}"
           th:text="#{diff.prev(${remainingBefore})}">Prev</a>
        <a class="btn btn-primary" th:classappend="${next == null} ? 'disabled'" th:href="${next}"
           th:text="#{diff.next(${remainingAfter})}">Next</a>
    </div>
</div>

<div th:if="${error != null}" class="alert alert-warning m-3" th:text="${error}">error</div>

<th:block th:if="${current != null}">
    <div class="mr-files">
        <div th:title="${current.left}">
            <span th:text="${current.left} ?: #{diff.noFile}">left</span>
            <span class="badge bg-danger" th:if="${current.status == 'DELETED'}" th:text="#{diff.deletedFile}">deleted</span>
        </div>
        <div th:title="${current.right}">
            <span th:text="${current.right} ?: #{diff.noFile}">right</span>
            <span class="badge bg-success" th:if="${current.status == 'ADDED'}" th:text="#{diff.addedFile}">added</span>
            <span class="badge bg-info text-dark" th:if="${current.status == 'MODIFIED' and current.left != current.right}"
                  th:text="#{diff.movedFile}">moved</span>
        </div>
    </div>
    <div class="mr-editors">
        <div th:id="'left-container-' + ${current.index}"></div>
        <div th:id="'right-container-' + ${current.index}"></div>
    </div>

    <div class="modal fade" id="legend" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" th:text="#{diff.legend}">Legend</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body mr-legend">
                <div><span class="deleted" th:text="#{diff.kind.deleted}">deleted</span></div>
                <div><span class="inserted" th:text="#{diff.kind.inserted}">inserted</span></div>
                <div><span class="updated" th:text="#{diff.kind.updated}">updated</span></div>
                <div><span class="moved" th:text="#{diff.kind.moved}">moved</span></div>
                <div><span class="mm" th:text="#{diff.kind.mm}">moved and updated</span></div>
                <div><span class="moveOut" th:text="#{diff.kind.moveOut}">moved to another file</span></div>
                <div><span class="moveIn" th:text="#{diff.kind.moveIn}">moved from another file</span></div>
                <p class="text-muted mt-2 mb-0" th:text="#{diff.legend.click}">Click mapped code to jump to its counterpart.</p>
            </div>
        </div></div>
    </div>

    <div class="modal fade" id="overview" tabindex="-1">
        <div class="modal-dialog modal-xl"><div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" th:text="#{diff.overview}">Overview</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body mr-overview">
                <table class="table table-sm">
                    <tr th:each="link : ${fileLinks}" th:classappend="${link.file.index == current.index} ? 'table-active'">
                        <td><span class="badge"
                                  th:classappend="${link.file.status == 'ADDED'} ? 'bg-success' : (${link.file.status == 'DELETED'} ? 'bg-danger' : 'bg-secondary')"
                                  th:text="#{'diff.status.' + ${link.file.status}}">MODIFIED</span></td>
                        <td><a th:href="${link.href}" th:text="${link.file.left} ?: ${link.file.right}">file</a></td>
                        <td th:text="${link.file.left != null and link.file.right != null and link.file.left != link.file.right} ? '→ ' + ${link.file.right} : ''"></td>
                    </tr>
                </table>
            </div>
        </div></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- monaco.js points require() at cdnjs monaco-editor 0.39.0; the loader must be the same version. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/loader.min.js"></script>
    <script th:src="@{/api/migration-risk/view/assets/utils.js}"></script>
    <script th:src="@{/api/migration-risk/view/assets/decorations.js}"></script>
    <script th:src="@{/api/migration-risk/view/assets/folding.js}"></script>
    <script th:src="@{/api/migration-risk/view/assets/listeners.js}"></script>
    <script th:src="@{/api/migration-risk/view/assets/pr-utils.js}"></script>
    <script th:src="@{/api/migration-risk/view/assets/marked.min.js}"></script>
    <script th:src="@{/api/migration-risk/view/assets/monaco.js}"></script>
    <!-- RefactoringMiner's own config: a JS object literal (file contents escaped by MonacoCore, "</" included). -->
    <script th:utext="'mymonaco(' + ${config} + ');'"></script>
</th:block>
</body>
</html>
