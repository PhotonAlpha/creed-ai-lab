server:
  port: 8080
spring:
  application:
    name: shop
  jackson:
    use-jackson2-defaults: true
  # Boot 3 renamed spring.redis.* to spring.data.redis.*
  data:
    redis:
      host: localhost
      port: 6380
management:
  endpoints:
    web:
      exposure:
        include: health,info
shop:
  order:
    max-items: 10
