# Migration sync risk. Plain HTTP on 18098, no database, no PKI: every answer is computed from the two
# git repositories at request time. The frontend reaches it through Vite's `/api/migration-risk` proxy
# (VITE_MIGRATION_RISK_TARGET).
#
#   mvn -pl creed-resource/creed-resource-migration-risk spring-boot:run -Dspring-boot.run.workingDirectory="$PWD"
server:
  port: ${CREED_MIGRATION_RISK_PORT:18098}

spring:
  application:
    name: creed-resource-migration-risk
  profiles:
    include: actuator
  # Jackson 3 (Boot 4) turned FAIL_ON_NULL_FOR_PRIMITIVES on; keep the Jackson 2 defaults like every module.
  jackson:
    use-jackson2-defaults: true

  # Analyses saved under a release, with each item's review. Create the database once:
  #   docker exec creed-artifactory-db createdb -U artifactory migration_risk
  # No Docker at hand: run with the `h2` profile (file database under migration-risk.work-dir).
  datasource:
    url: "${CREED_MIGRATION_RISK_DB_URL:jdbc:postgresql://127.0.0.1:5432/migration_risk}"
    username: "${CREED_MIGRATION_RISK_DB_USER:artifactory}"
    password: "${CREED_MIGRATION_RISK_DB_PASSWORD:artifactory_pw}"
    hikari:
      pool-name: migration-risk-pool
      maximum-pool-size: 5
      connection-timeout: 5000
  jpa:
    # Flyway owns the schema (db/migration, written to run on PostgreSQL and H2 alike).
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

migration-risk:
  # The request names repositories by path on THIS host. Only paths under one of these roots are opened —
  # the API would otherwise read any git repository the process can reach. Comma-separated.
  allowed-roots: ${CREED_MIGRATION_RISK_ROOTS:${user.home}}
  # Per-analysis scratch space (the exported file subsets RefactoringMiner compares); deleted afterwards.
  work-dir: ${CREED_MIGRATION_RISK_WORK_DIR:${java.io.tmpdir}/creed-migration-risk}
  # More differing files than this is refused (422 too_many_changes): RefactoringMiner's memory and time grow with
  # the files it parses. Without a baseline every file the migration touched differs, so this counts whole repos.
  max-changed-files: ${CREED_MIGRATION_RISK_MAX_FILES:5000}
  # A file with the same name elsewhere in repo2 is copied into the comparison so RefactoringMiner can see a
  # moved class; common names (package-info.java, Utils.java) are capped at this many candidates.
  max-candidates-per-name: 5
  # Folder mode reads whatever is on disk; these directory names are skipped at any depth. Build output and IDE
  # files differ between any two checkouts and would bury the real changes.
  # Background analyses streamed over SSE (POST /analyses/jobs, GET /analyses/jobs/{id}/events).
  jobs:
    concurrency: ${CREED_MIGRATION_RISK_CONCURRENCY:2}
    queue: 10
    retention: 30m
  directory-excludes: [.git, .svn, .idea, .vscode, .gradle, target, build, out, dist, node_modules, logs, tmp]
  # Config is compared key by key across ALL these files of each tree (a key moved between files is no change; a
  # key repo2 keeps in another file, or in repo2B, is found). Spring's application*/bootstrap* files always count;
  # this regex adds the rest — properties / yml under resources/ or config/, not CI pipelines or Helm charts.
  config-files: '(.*/)?(resources|config)/.*\.(properties|ya?ml)'
  # Config keys renamed by Spring Boot, on top of the deprecation metadata in Boot's own jars (~260 keys in 4.1.1;
  # Boot 3.0's renames are no longer there). A key ending in '.' renames the whole prefix. A repo1 key repo2
  # holds only under its new name, with repo1's value, is CONFIG_IN_SYNC instead of "missing".
  config-renames:
    "[spring.redis.]": spring.data.redis.
    "[spring.data.cassandra.]": spring.cassandra.
    "[spring.elasticsearch.rest.]": spring.elasticsearch.
  # Git URLs instead of server paths (git mode): https:// only, cloned bare into <work-dir>/remotes and fetched
  # again when older than fetch-interval. Hosts must be listed — the URL counterpart of allowed-roots. Tokens
  # come from the environment, never from the request.
  remotes:
    allowed-hosts: ${CREED_MIGRATION_RISK_GIT_HOSTS:github.com}
    fetch-interval: 1m
    credentials:
      - host: ${CREED_MIGRATION_RISK_GIT_HOST:github.com}
        username: ${CREED_MIGRATION_RISK_GIT_USER:token}
        password: ${CREED_MIGRATION_RISK_GIT_TOKEN:}
  # "Create Jira issue" on a reviewed item. mock: keys made up in memory (MIG-101 ...), nothing leaves the process.
  jira:
    mock: ${CREED_MIGRATION_RISK_JIRA_MOCK:true}
    base-url: ${CREED_MIGRATION_RISK_JIRA_URL:}
    project-key: ${CREED_MIGRATION_RISK_JIRA_PROJECT:MIG}
    issue-type: Task
    token: ${CREED_MIGRATION_RISK_JIRA_TOKEN:}
  # Formats the migration converted: repo1's x.vm is looked up as x.ftl in repo2 and compared through a drafted
  # conversion (TEMPLATE_CONVERTED, MEDIUM; ALREADY_SYNCED when the draft matches).
  extension-mappings:
    vm: ftl
  # repo1 lines that repo2 lacks matching one of these are flagged MIGRATION_API (MEDIUM): code written against an
  # API the migration replaced, to convert while porting. A match alone in its file is the migration's own rewrite
  # and is not reported. Java regex, matched per line.
  api-rules:
    - id: jackson2
      pattern: 'com\.fasterxml\.jackson\.(databind|core|datatype|dataformat)\.'
      hint: 'Jackson 3: tools.jackson.* (annotations stay com.fasterxml.jackson.annotation)'
    - id: jackson2-exception
      pattern: '\bJsonProcessingException\b'
      hint: 'Jackson 3: tools.jackson.core.JacksonException (unchecked)'
    - id: javax-servlet
      pattern: '\bjavax\.servlet\.'
      hint: 'Jakarta EE: jakarta.servlet.*'
    - id: javax-persistence
      pattern: '\bjavax\.(persistence|validation|annotation\.PostConstruct|xml\.bind)\b'
      hint: 'Jakarta EE: jakarta.*'
    - id: boot-rest-template-builder
      pattern: 'org\.springframework\.boot\.web\.client\.'
      hint: 'Boot 4: org.springframework.boot.restclient.* (spring-boot-starter-restclient)'
    - id: boot-embedded-tomcat
      pattern: 'org\.springframework\.boot\.web\.embedded\.'
      hint: 'Boot 4: org.springframework.boot.tomcat.* / org.springframework.boot.jetty.*'
    - id: boot-actuate-moved
      pattern: 'org\.springframework\.boot\.actuate\.(metrics\.MetricsEndpoint|health\.HealthEndpoint)'
      hint: 'Boot 4: org.springframework.boot.{micrometer.metrics,health}.actuate.endpoint.*'
    - id: http-headers-map
      pattern: '\.containsKey\(\s*HttpHeaders\.'
      hint: 'Spring Framework 7: HttpHeaders is not a Map — containsHeader(...)'
    - id: velocity
      pattern: 'org\.apache\.velocity\.|\bVelocityEngine\b'
      hint: 'repo2 renders FreeMarker (.ftl): freemarker.template.Configuration instead of Velocity'
    - id: camel-hystrix
      pattern: 'org\.apache\.camel\.component\.hystrix|\.hystrix\(\)'
      hint: 'Camel 4 removed camel-hystrix: use camel-resilience4j (circuitBreaker())'
  # Two small generated repositories (src/main/resources/demo/**) so the page and the tests have something
  # to analyse without real checkouts. Rebuilt in <work-dir>/demo at every start, with fixed commit times,
  # so their commit ids are always the same.
  demo:
    enabled: ${CREED_MIGRATION_RISK_DEMO:true}
management:
  otlp:
    metrics:
      export:
        enabled: off
otel:
  sdk:
    disabled: true
  # 或只关闭指标
  metrics:
    exporter: none
logging:
  # RefactoringMiner's jar carries its own logback.xml (root WARN, stderr only), and Boot picks a plain
  # logback.xml before logback-spring.xml — it silently replaced creed-common-metrics' config: no INFO on the
  # console, no log file, no OTLP logs. Naming the config explicitly skips that search.
  config: classpath:logback-spring.xml
  level:
    io.opentelemetry.exporter: OFF
