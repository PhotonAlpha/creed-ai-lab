server:
  port: ${CREED_LB_HEALTH_PORT:18099}
  servlet:
    context-path: /api/lb-health

spring:
  application:
    name: creed-resource-lb-health
  # Jackson 3 (Boot 4) changed defaults the APIs were written against - keep Jackson 2's (repo convention).
  jackson:
    use-jackson2-defaults: true
  cloud:
    discovery:
      client:
        # Spring Cloud's discovery health indicators wait for an InstanceRegisteredEvent the simple discovery client
        # never publishes: /actuator/health would show them as UNKNOWN "Discovery Client not initialized" forever.
        health-indicator:
          enabled: false
        simple:
          # 10 instances. On localhost they are this app's own extra connectors (TargetConnectorsConfiguration);
          # point them at real hosts and set creed.lb-health.target.embedded=false to test a real service.
          instances:
            lb-health-target:
              - { instance-id: i00, uri: "http://localhost:18100" }
              - { instance-id: i01, uri: "http://localhost:18101" }
              - { instance-id: i02, uri: "http://localhost:18102" }
              - { instance-id: i03, uri: "http://localhost:18103" }
              - { instance-id: i04, uri: "http://localhost:18104" }
              - { instance-id: i05, uri: "http://localhost:18105" }
              - { instance-id: i06, uri: "http://localhost:18106" }
              - { instance-id: i07, uri: "http://localhost:18107" }
              - { instance-id: i08, uri: "http://localhost:18108" }
              - { instance-id: i09, uri: "http://localhost:18109" }
            # Second cluster, for the bulkhead (2026-11-18): 3 instances, Spring's default LoadBalancer (no health check, no
            # @LoadBalancerClient). Slow them down with PUT /target/instances/1811x?delay=2s and run a concurrent load.
            lb-health-bulkhead:
              - { instance-id: b00, uri: "http://localhost:18110" }
              - { instance-id: b01, uri: "http://localhost:18111" }
              - { instance-id: b02, uri: "http://localhost:18112" }
    loadbalancer:
      # Without this the supplier is created lazily by the first request, which then waits for a whole round.
      # Listed here, LoadBalancerEagerContextInitializer builds it on ApplicationReadyEvent and the first round
      # runs before traffic needs it.
      eager-load:
        clients:
          - lb-health-target
      health-check:
        # REQUIRED false. true (the default) re-emits a growing list after every answering instance - [1], [1,2]
        # ... - and get() (replay(1)) returns that partial list until the round ends, every round.
        update-results-list: ${CREED_LB_HC_UPDATE_RESULTS_LIST:true}
        # 0: start the first round as soon as the supplier exists; any delay is added to the first request's wait.
        initial-delay: ${CREED_LB_HC_INITIAL_DELAY:10s}
        # Pause between the END of one round and the start of the next (repeatWhen), and also the per-probe
        # timeout Spring applies - which only works for non-blocking probes (webclient mode).
        interval: ${CREED_LB_HC_INTERVAL:30s}
        # REQUIRED true: the blocking DiscoveryClient emits once and completes; only refetching sees scaling.
        refetch-instances: ${CREED_LB_HC_REFETCH:true}
        # MUST be > interval, and > the worst-case round (blocking: instances × (connect + read) = 10 × 5s = 50s).
        # Each refetch replaces the running health-check stream (switchMap): it cancels the interval timer and any
        # round still in flight. refetch <= interval → the interval never fires; round >= refetch → no round ever
        # completes and get() stays on the last completed list.
        refetch-instances-interval: ${CREED_LB_HC_REFETCH_INTERVAL:60s}
        path:
          lb-health-target: /api/lb-health/target/health
      # NOTE: do not add a spring.cloud.loadbalancer.clients.lb-health-target block for one tweak: it does NOT
      # inherit the global block above; every key it omits falls back to the library default (interval 25s,
      # update-results-list true, refetch false ...). HealthCheckConfigValidator checks the effective values.

# Actuator (asked for, 2026-11-19): on the app port, under the context path - /api/lb-health/actuator/... (the target
# connectors 18100-18112 serve it too; they are this same app). resilience4j-spring-boot3 2.3.0's endpoints, events and
# Micrometer metrics work on Boot 4; its health indicator does not (Boot 3 package) - CircuitBreakersHealthIndicator
# replaces it, honouring register-health-indicator / allow-health-indicator-to-fail.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,circuitbreakers,circuitbreakerevents,bulkheads,bulkheadevents
  endpoint:
    health:
      show-details: always

# Health-check request/response log (asked for, 2026-11-17): Logbook on the two probe clients only, Splunk key=value.
# The target instances are this app's own connectors, so the inbound filter would log every probe a second time.
logbook:
  filter:
    enabled: false
  format:
    style: splunk

logging:
  pattern:
    # the probe's round in Splunk key=value, after the level - " trigger=INTERVAL round=12" - on every line logged
    # inside a probe (Logbook's request / response, [HC]); dropped where the MDC is empty. Debug only:
    # the MDC comes from ObservableHealthCheckServiceInstanceListSupplier (CREED_LB_DEBUG=true).
    level: "%5p%replace( trigger=%X{hcTrigger} round=%X{hcRound}){'^ trigger= round=$', ''}"
  level:
    # Logbook writes at TRACE; set CREED_LB_LOGBOOK_LEVEL=INFO to silence it (nothing is buffered then)
    org.zalando.logbook.Logbook: ${CREED_LB_LOGBOOK_LEVEL:TRACE}

# Resilience around the business RestTemplate (DownstreamCaller, /cb/*): ONE circuit breaker and ONE bulkhead PER
# CLUSTER (= per key under spring.cloud.discovery.client.simple.instances), named after it, created at start-up from
# configs.default; resilience4j.<circuitbreaker|bulkhead>.instances.<cluster> overrides one cluster. Nesting:
# Bulkhead(CircuitBreaker(call)) - NOT resilience4j's annotation order: a full bulkhead never reaches the breaker and
# the bulkhead wait is not part of the call duration (docs §4.4). What every key does, how they combine, the risks: docs/resilience4j-circuit-breaker.md §4.
# register-health-indicator works through CircuitBreakersHealthIndicator (resilience4j's own targets Boot 3's package);
# event-consumer-buffer-size feeds /actuator/circuitbreakerevents; circuit-breaker-aspect-order is inert (no annotations).
resilience4j:
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 20
    instances:
      # Small on purpose, so a concurrent load run shows it. max-wait-duration 60s (2026-11-19): a full bulkhead QUEUES the call on the caller's
      # thread for up to 60 s instead of rejecting it - those threads are held meanwhile (docs §4.4, risk R13).
      lb-health-bulkhead:
        max-concurrent-calls: 10
        max-wait-duration: 60s
  circuitbreaker:
    circuit-breaker-aspect-order: 1

    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 200
        minimum-number-of-calls: 50
        failure-rate-threshold: 60
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 10
        automatic-transition-from-open-to-half-open-enabled: true

        record-failure-predicate: com.creed.resource.lbhealth.downstream.DownstreamCircuitBreakerFailurePredicate
        event-consumer-buffer-size: 200
        register-health-indicator: true
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 60s


creed:
  lb-health:
    health-check:
      # blocking  = withBlockingHealthChecks(RestTemplate): probes run serially on one Reactor thread.
      # webclient = withHealthChecks(WebClient): probes run concurrently; Spring's timeout(interval) applies.
      mode: ${CREED_LB_HC_MODE:blocking}
      connect-timeout: ${CREED_LB_HC_CONNECT_TIMEOUT:2s}
      read-timeout: ${CREED_LB_HC_READ_TIMEOUT:3s}
    debug:
      # [REFETCH] / [HC] / [HC-STREAM] / [HC-ROUND] / [HC-RESULT] logs, and the probe MDC (trigger=… round=…).
      enabled: ${CREED_LB_DEBUG:false}
    target:
      embedded: ${CREED_LB_TARGET_EMBEDDED:true}
    logbook:
      # false: the probe clients get no Logbook interceptor / filter at all. CREED_LB_LOGBOOK_LEVEL only silences it.
      enabled: ${CREED_LB_LOGBOOK:false}
