spring:
  config:
    import: "optional:configserver:"
  profiles:
    include: actuator
  ssl:
    bundle:
      jks:
        creed-payment-server:
          key:
            alias: creed-resource-payment
          keystore:
            location: "file:${creed.rootPath}/creed-resource-payment-keystore.p12"
            password: "${CREED_PAYMENT_KEYSTORE_PASSWORD:changeit}"
            type: PKCS12
          truststore:
            location: "file:${creed.rootPath}/creed-resource-payment-truststore.p12"
            password: "${CREED_PAYMENT_TRUSTSTORE_PASSWORD:changeit}"
            type: PKCS12

# TomcatHttpsConfiguration (creed.https.enabled=true by default) wires the embedded
# HTTPS listener to the SSL bundle named by `creed.https.bundle`. Outside the `cloud`
# profile no bundle is delivered by the config server, so we define one locally here
# from the service's own PKCS12 keystore/truststore (generated by CA-Generation.sh).
creed:
  https:
    bundle: creed-payment-server
  rootPath: ".support/scripts/pki" # relative to the repo root — the process working dir must be the repo root (-Dspring-boot.run.workingDirectory="$PWD" / IDE working dir)
