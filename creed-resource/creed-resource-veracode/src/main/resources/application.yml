# Veracode report analysis. Plain HTTP on 18097, no database, no PKI: every answer is computed from
# Confluence and Jira at request time. The frontend reaches it through Vite's `/api/veracode` proxy
# (VITE_VERACODE_TARGET).
#
#   mvn -pl creed-resource/creed-resource-veracode spring-boot:run -Dspring-boot.run.workingDirectory="$PWD"
server:
  port: ${CREED_VERACODE_PORT:18097}

spring:
  application:
    name: creed-resource-veracode
  profiles:
    include: actuator
  # Jackson 3 (Boot 4) turned FAIL_ON_NULL_FOR_PRIMITIVES on: a request body that omits a boolean
  # (`{}` for {"autoCreate": false}) became a 400. Keep the Jackson 2 defaults the API was written for.
  jackson:
    use-jackson2-defaults: true
  servlet:
    multipart:
      max-file-size: ${CREED_VERACODE_MAX_UPLOAD:10MB}
      max-request-size: ${CREED_VERACODE_MAX_UPLOAD:10MB}

veracode:
  # In-process stand-ins for Confluence and Jira under /mock/confluence and /mock/jira (MockJiraStore,
  # mock/confluence/*.html). The base URLs below point at them by default; set CREED_VERACODE_MOCK=false
  # together with the real URLs and tokens.
  mock:
    enabled: ${CREED_VERACODE_MOCK:true}

  confluence:
    # Before /rest/api: https://wiki.example.com (Data Center), https://example.atlassian.net/wiki (Cloud)
    base-url: ${CREED_CONFLUENCE_URL:http://localhost:${server.port}/mock/confluence}
    page-id: ${CREED_VERACODE_PAGE_ID:98765}
    browse-url: ${CREED_CONFLUENCE_BROWSE_URL:}
    auth:
      # NONE | BEARER (Data Center PAT) | BASIC (Cloud: e-mail + API token)
      type: ${CREED_CONFLUENCE_AUTH:NONE}
      username: ${CREED_CONFLUENCE_USER:}
      token: ${CREED_CONFLUENCE_TOKEN:}
    connect-timeout: 5s
    read-timeout: 20s
    # spring.ssl.bundle name for an https base URL signed by a private CA; blank = JDK cacerts.
    ssl-bundle: ${CREED_CONFLUENCE_SSL_BUNDLE:}

  jira:
    base-url: ${CREED_JIRA_URL:http://localhost:${server.port}/mock/jira}
    project-key: ${CREED_JIRA_PROJECT:CREED}
    issue-type: ${CREED_JIRA_ISSUE_TYPE:Bug}
    summary-prefix: "[Veracode]"
    labels: [veracode]
    browse-url: ${CREED_JIRA_BROWSE_URL:http://localhost:${server.port}/mock/jira/browse/{key}}
    jql-batch-size: 40
    page-size: 100
    auth:
      type: ${CREED_JIRA_AUTH:NONE}
      username: ${CREED_JIRA_USER:}
      token: ${CREED_JIRA_TOKEN:}
    connect-timeout: 5s
    read-timeout: 20s
    ssl-bundle: ${CREED_JIRA_SSL_BUNDLE:}

  # Report column headers (case-insensitive). See ReportProperties for the defaults.
  report:
    affected-version: ["Affected Version", "Affects Version", "Version"]

  # Uploaded reports (POST /api/veracode/analysis/upload) stay in memory so create/export can re-read
  # them by id. Lost on restart; per instance.
  upload:
    ttl: 2h
    max-entries: 50
management:
  endpoint:
    configprops:
      show-values: always
    env:
      access: unrestricted
      show-values: always
  endpoints:
    web:
      exposure:
        include: "*"
