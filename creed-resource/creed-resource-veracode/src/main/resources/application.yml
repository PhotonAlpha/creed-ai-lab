# Veracode SCA report analysis. Plain HTTP on 18097, no PKI: an uploaded Veracode XML report is matched against Jira
# at request time. The only database is for report templates (an H2 file by default, see spring.datasource). The frontend reaches it through Vite's `/api/veracode` proxy
# (VITE_VERACODE_TARGET).
#
#   mvn -pl creed-resource/creed-resource-veracode spring-boot:run -Dspring-boot.run.workingDirectory="$PWD"
server:
  port: ${CREED_VERACODE_PORT:18097}

spring:
  application:
    name: creed-resource-veracode
  profiles:
    include: actuator
  # Jackson 3 (Boot 4) turned FAIL_ON_NULL_FOR_PRIMITIVES on: a request body that omits a boolean
  # (`{}` for {"autoCreate": false}) became a 400. Keep the Jackson 2 defaults the API was written for.
  jackson:
    use-jackson2-defaults: true
  servlet:
    multipart:
      # A detailed report carries every static flaw too; only its SCA section is read (streamed).
      max-file-size: ${CREED_VERACODE_MAX_UPLOAD:50MB}
      max-request-size: ${CREED_VERACODE_MAX_UPLOAD:50MB}
  # Report templates (an uploaded .xlsx + its cell bindings) live here. Default: an H2 file under the working
  # directory - data/veracode/ of the repo root with spring-boot:run -Dspring-boot.run.workingDirectory="$PWD", of the
  # module in an IDE run - so they survive a restart without Docker. PostgreSQL: the `postgres` profile.
  datasource:
    url: "${CREED_VERACODE_DB_URL:jdbc:h2:file:./data/veracode/veracode;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}"
    username: "${CREED_VERACODE_DB_USER:sa}"
    password: "${CREED_VERACODE_DB_PASSWORD:}"
  flyway:
    # one set of scripts: H2 runs them in PostgreSQL mode
    locations: classpath:db/migration

veracode:
  # In-process stand-in for Jira under /mock/jira (MockJiraStore) and the sample report
  # (POST /api/veracode/analysis/sample). The Jira URLs below point at the mock by default; set
  # CREED_VERACODE_MOCK=false together with the real URL.
  mock:
    enabled: ${CREED_VERACODE_MOCK:false}

  jira:
    # Lookup = JQL search, search-batch-size findings per call (DC /rest/api/2/search, Cloud /rest/api/3/search/jql);
    # createmeta for versions and the connection test, POST /rest/api/2/issue to create. Apache HttpClient 5 underneath.
    # TLS to Jira is NOT verified - no certificate check, no hostname check (asked for; TrustAllTls).
    base-url: "https://ethancaoq.atlassian.net"
    project-key: DT
    issue-type: Defect
    # {project} in created summaries and a label on every created issue - this service's own name, not the Veracode
    # application. Blank = project-key.
    project-name: IDB VERACODE SCA
    # Created issue title. {project} = project-name, {cve} = the cve_id ("Unknown" without one), {cwe} = the cwe_id
    # ("Unknown" without one), {file} = the component's file_name, {application} = the Veracode app_name;
    # {component}, {jiraProject}, {version} also work. An issue matches when its summary names the CVE (Unknown + CWE
    # without one) and - as far as the template has them - the {file} and the {component}.
    summary-template: ${CREED_JIRA_SUMMARY_TEMPLATE:{project} - {cve}|{cwe} - {file}}
    # A finding (SCA or SAST) whose issues are ALL in one of these statuses (any case) may be filed again - one at a
    # time, after the page's confirmation (recreateClosed). Bulk creates still treat a closed issue as filed.
    closed-statuses: Closed, Done
    # The SCA issue type's Country field, by id (customfield_10300) or name, any case: its options are the page's Country
    # select (several = any of them), searched as cf[<id>] in (...). Not on the create screen = no select. Creating
    # does not take the value from the select - the create screen's own field (defaults.fields) does.
    country-field: ${CREED_JIRA_COUNTRY_FIELD:Country}
    # An analysis reuses a create screen (issue types + fields) it read within this long, per token / project / issue type:
    # changing the Jira versions or Country then costs one Jira search instead of three calls. Issues are never cached,
    # and "test connection" always reads afresh. 0 = off.
    meta-cache-ttl: 60s
    # No Jira account here: every call (lookup, createmeta, create) uses the token the user typed on the page,
    # sent as X-Jira-Token. The page asks Cloud or Data Center: Cloud adds the Atlassian e-mail (X-Jira-User) and
    # goes to Jira as Basic base64(email:token), Data Center's personal access token as Bearer. Both REST API v2.
    # Without a token a request is 400 jira_token_required.
    # Every created issue: these, project-name and the application's label - its name under veracode.applications
    # below, else its app_name. The same issue reported by another application gets that application's label added
    # instead of a second issue.
    labels: ["IDB VERACODE SCA"]
    browse-url: https://ethancaoq.atlassian.net/browse/{key}
    # maxResults of the paged createmeta calls (issue types / fields of the issue type)
    page-size: 50
    # What the page preselects after "test connection" - only values this Jira offers; one it does not (a version not
    # released yet, an option renamed) is dropped and the page keeps its own choice.
    # affects-versions: the "Jira versions" select (Affects Version/s, any case). Several = looked up in all of them;
    #   creating needs exactly one, so name one if the page should be ready to create.
    # fields: create-screen fields by field id (components, customfield_10100) or name (Environment Found) - case,
    #   spaces and punctuation are ignored;
    #   option names (or ids), or the value itself for a text / number / user field. Overrides Jira's own default.
    defaults:
      affects-versions: ${CREED_JIRA_DEFAULT_VERSIONS:}
      fields:
        country: Singapore
      #  components: [Security]
      #  Environment Found: [Production]
    max-connections: 20
    connect-timeout: 5s
    read-timeout: 20s
    # SAST (static-analysis) flaws: one issue per CWE + flaw category (categoryname), open flaws only (fixed and
    # mitigated ones are never filed). Looked up AND created by the summary alone - no Affects Version/s clause in the
    # search; when the issue type's screen requires the field, creating files under the version chosen for SAST on
    # the page. Own project / issue type / labels; a blank one falls back to the SCA value above.
    sast:
      project-key: ${CREED_JIRA_SAST_PROJECT:DT}
      issue-type: ${CREED_JIRA_SAST_ISSUE_TYPE:Defect}
      # {project} in the summary, and a label (spaces become _ in a label)
      project-name: IDB VERACODE STSA
      # {project}, {cwe} (CWE-89), {category} (the flaw's categoryname), {jiraProject}. Matching needs the CWE and the
      # category in the summary: keep both.
      summary-template: "{project} - {cwe} - {category}"
      labels: ["IDB VERACODE STSA"]
      # like jira.defaults, for the SAST issue type's create screen (affects-versions = the SAST version select)
      defaults:
        affects-versions: []
        fields:
          country: Singapore

  # Veracode applications (app_name, any case) under a name of their own and a link: the name is what the page, the
  # Jira description (Veracode application) and the Confluence export (Repository) show, linked to url, and it is the
  # application's Jira label (no link there). An app_name without an entry is shown, and labelled, as itself.
  applications:
    - app-name: GBT-T1-Creed-CCS
      name: Creed-CCS
      url: https://github.com/PhotonAlpha/creed-ai-lab
    - app-name: creed-platform-2026-10-06-Creed
      name: Creed-Oct
      url: https://github.com/PhotonAlpha/creed-ai-lab
    - app-name: creed-gateway-2026-10-08-Gateway
      name: Creed-Oct-2
      url: https://github.com/PhotonAlpha/creed-ai-lab

  # A Confluence page's attachments as a report source (the page lists them, the user picks .xml / .zip, this service
  # downloads and analyses them). Like Jira: no account here, every call uses the user's own token (X-Confluence-Token,
  # + X-Confluence-User = the Atlassian e-mail on Cloud). REST API v1, Apache HttpClient 5, TLS NOT verified.
  # base-url: Cloud https://<site>.atlassian.net/wiki, Data Center its context root. Blank = no Confluence on the page.
  # The default is the in-process mock (page 98765).
  confluence:
    base-url: "https://ethancaoq.atlassian.net/wiki"
    # The page the reports' pages are filed under: the page lists its child pages to pick one from (filtered by
    # title in the browser), then that page's attachments. Blank = the user types a page id.
    parent-page-id: ${CREED_CONFLUENCE_PARENT_PAGE:131219}
    page-size: 50
    # Larger attachments are not downloaded (read into memory whole); a zip is then bounded by upload.max-unzipped-size
    max-download-size: ${CREED_CONFLUENCE_MAX_DOWNLOAD:50MB}
    # "Export to Confluence": a child page of the page the user names, in its space, as the user (their Confluence
    # token). Layout: sample/confluence-template.png, template: templates/veracode/confluence-report.html.
    # {project} = the reports' Veracode application(s), {version} = their version - both editable on the page.
    export-title: "{project} - {version} - Reports (SAST,SCA) - {timestamp}"
    export-timestamp: yyyy-MM-dd HH-mm-ss
    # {timestamp}'s zone; blank = this server's
    export-time-zone: ${CREED_CONFLUENCE_EXPORT_ZONE:}
    max-connections: 10
    connect-timeout: 5s
    read-timeout: 60s

  # Uploaded Veracode XML reports (POST /api/veracode/analysis/upload) stay in memory, parsed, so
  # re-analysis, create and export can re-read them by id. Lost on restart; per instance.
  upload:
    ttl: 2h
    max-entries: 50
    # A .zip upload is read as the .xml files in it (the .xsd beside them is skipped). Bounded by what it inflates
    # to, not by its compressed size (that is the multipart limit above).
    max-unzipped-size: ${CREED_VERACODE_MAX_UNZIPPED:500MB}
    max-archive-reports: 50
# Jira request/response log (Logbook, from the Jira client's HttpClient exec chain; RemoteClientsConfiguration).
# Lines go to the org.zalando.logbook.Logbook logger at TRACE - CREED_VERACODE_LOGBOOK_LEVEL=OFF silences it.
logbook:
  filter:
    enabled: false           # this service's own inbound requests (uploads, X-Jira-Token) are not logged
  format:
    style: ${CREED_VERACODE_LOGBOOK_STYLE:http}   # http (readable blocks) | splunk | json | curl
  obfuscate:
    headers:                 # the user's token travels as Authorization: Bearer
      - Authorization
      - Proxy-Authorization
      - Cookie
      - Set-Cookie
  write:
    max-body-size: -1   # createmeta / issue bodies can be long

logging:
  level:
    org.zalando.logbook.Logbook: ${CREED_VERACODE_LOGBOOK_LEVEL:TRACE}

management:
  endpoint:
    configprops:
      show-values: always
    env:
      access: unrestricted
      show-values: always
  endpoints:
    web:
      exposure:
        include: "*"

  
otel:
  logs:
    exporter: none
  metrics:
    exporter: none
  traces:
    exporter: none