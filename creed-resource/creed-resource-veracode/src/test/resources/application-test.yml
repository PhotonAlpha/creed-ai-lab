# The actuator profile is included from application.yml and cannot be un-included here, so the OTel
# starter is active: it interpolates ${spring.application.name} and ${server.port}, and must not try to
# reach the collector.
spring:
  application:
    name: creed-resource-veracode-test
  # in memory, one per JVM: no file under the module, and the report-template tests see each other's rows
  datasource:
    url: "jdbc:h2:mem:veracode-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""
  # schema only: db/defaults' application aliases would rename the sample's applications
  flyway:
    locations: classpath:db/migration
server:
  port: 0
otel:
  sdk:
    disabled: true

veracode:
  mock:
    enabled: true
  jira:
    # Never called over the network: VeracodeApiTest swaps the client onto MockMvc.
    base-url: http://localhost/mock/jira
    # The mock's project, whatever application.yml points at
    project-key: CREED
    issue-type: Bug
    # {project} of created summaries and a label: "creed - CVE-2021-44228|CWE-502 - log4j-core-2.14.1.jar"
    project-name: creed
    labels: [veracode]
    browse-url: http://localhost/mock/jira/browse/{key}
    # Small on purpose: the create metadata (4 issue types, 7 fields) then takes several pages.
    page-size: 2
    # Three findings per search, so the sample report's lookups take several batches.
    search-batch-size: 3
    # 9.9.9 is not in the mock: dropped. "Environment Found" by name, its option by value
    defaults:
      affects-versions: [2.3.0, 9.9.9]
      fields:
        Environment Found: [Staging]
    # SAST: the mock's project, another issue type than SCA's Bug - "creed-sast - CWE-89 - <category>"
    sast:
      project-key: CREED
      issue-type: Vulnerability
      project-name: creed-sast
      labels: [veracode-sast]
      defaults:
        affects-versions: [9.9.9, 2.4.0]
  # The second sample report's application under another name, with a link; the first sample's stays its app_name.
  # Deliberately the old property: it is imported into application_alias at start (ApplicationAliasService), which
  # VeracodeApiTest relies on - that is the import's test.
  applications:
    - app-name: creed-gateway-2026-10-08-Gateway
      name: Creed-Gateway
      url: https://git.example.com/projects/GATEWAY/browse
  confluence:
    # Never called over the network either: the test swaps the client onto MockMvc.
    base-url: http://localhost/mock/confluence
    parent-page-id: "98700"
    # Three attachments on the mock page: two pages of the listing
    page-size: 2
