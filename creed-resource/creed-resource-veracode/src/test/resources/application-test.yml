# The actuator profile is included from application.yml and cannot be un-included here, so the OTel
# starter is active: it interpolates ${spring.application.name} and ${server.port}, and must not try to
# reach the collector.
spring:
  application:
    name: creed-resource-veracode-test
server:
  port: 0
otel:
  sdk:
    disabled: true

veracode:
  mock:
    enabled: true
  jira:
    # Never called over the network: VeracodeApiTest swaps the client onto MockMvc.
    base-url: http://localhost/mock/jira
    # The mock's project, whatever application.yml points at
    project-key: CREED
    issue-type: Bug
    # {project} of created summaries and a label: "creed - CVE-2021-44228|CWE-502 - log4j-core-2.14.1.jar"
    project-name: creed
    labels: [veracode]
    browse-url: http://localhost/mock/jira/browse/{key}
    # Small on purpose: the create metadata (4 issue types, 7 fields) then takes several pages.
    page-size: 2
    # Three findings per search, so the sample report's lookups take several batches.
    search-batch-size: 3
    # 9.9.9 is not in the mock: dropped. "Environment Found" by name, its option by value
    defaults:
      affects-versions: [2.3.0, 9.9.9]
      fields:
        Environment Found: [Staging]
