<!--/*@thymesVar id="reportPropertiesOverview" type="com.creed.parent.controller.vo.ReportPropertiesOverviewVo"*/-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--/*
  Overall comparison: every property of both sources side by side, identical lines included.
  Rows are DiffDisplay from DiffService#overallDisplayList — deltaType EQUAL (plain), DELETE on the left
  (red) / CHANGE on the right (green). "Differences only" hides the EQUAL rows client-side.
*/-->
<div th:fragment="overallHtml">
    <style>
        .overall-only-diff tr.overall-equal { display: none; }
    </style>
    <table class="table table-hover table-borderless"
           th:with="leftReport=${reportPropertiesOverview?.overallPropertiesOverview?.leftPropertyReview},rightReport=${reportPropertiesOverview?.overallPropertiesOverview?.rightPropertyReview},displayList=${reportPropertiesOverview?.overallPropertiesOverview?.displayList},summary=${reportPropertiesOverview?.overallSummary}"
           style="table-layout: fixed; word-break: break-all; word-wrap: break-word; ">

        <colgroup>
            <col style="width: 40px;">
            <col style="width: auto;">
            <col style="width: 40px;">
            <col style="width: auto;">
        </colgroup>

        <tbody>
        <tr>
            <th scope="col" colspan="4" class="text-center">
                <div class="alert alert-primary mb-0" role="alert">
                    Overall Comparison
                </div>
            </th>
        </tr>
        <tr th:if="${summary != null}">
            <th scope="col" colspan="4" class="border-bottom">
                <div class="d-flex flex-wrap gap-2 align-items-center font-8">
                    <span class="badge text-bg-secondary" th:text="|Total ${summary.total}|"></span>
                    <span class="badge text-bg-light border" th:text="|Identical ${summary.identical}|"></span>
                    <span class="badge text-bg-warning" th:text="|Different value ${summary.changed}|"></span>
                    <span class="badge text-bg-danger"
                          th:text="|Only in ${leftReport?.reportDetails?.releaseName} ${summary.onlyInBaseline}|"></span>
                    <span class="badge text-bg-success"
                          th:text="|Only in ${rightReport?.reportDetails?.releaseName} ${summary.onlyInComparison}|"></span>
                    <div class="form-check form-switch ms-auto mb-0">
                        <input class="form-check-input" type="checkbox" role="switch" id="overallOnlyDiff"
                               onchange="document.getElementById('overallDiffTable').classList.toggle('overall-only-diff', this.checked)">
                        <label class="form-check-label" for="overallOnlyDiff">Differences only</label>
                    </div>
                </div>
            </th>
        </tr>
        <tr>
            <th scope="col" colspan="2" class="border-bottom">
                <p class="mb-1 font-8">
                    Release:
                    <span class="fw-lighter text-primary" th:text="${leftReport?.reportDetails?.releaseName}"></span>
                </p>
                <p class="mb-1 font-8">
                    Country:
                    <span class="fw-lighter text-primary" th:text="${leftReport?.reportDetails?.countryCode}"></span>
                </p>
                <p class="mb-1 font-8">
                    Profiles:
                    <span class="fw-lighter text-primary" th:text="${leftReport?.reportDetails?.profile}"></span>
                </p>
                <p class="mb-1 font-8">
                    Environment:
                    <span class="fw-lighter text-primary" th:text="${leftReport?.reportDetails?.environment}"></span>
                </p>
                <p class="mb-1 font-8">
                    Instance:
                    <span class="fw-lighter text-primary" th:text="${leftReport?.reportDetails?.instance}"></span>
                </p>
            </th>
            <th scope="col" colspan="2" class="border-bottom">
                <p class="mb-1 font-8">
                    Release:
                    <span class="fw-lighter text-primary" th:text="${rightReport?.reportDetails?.releaseName}"></span>
                </p>
                <p class="mb-1 font-8">
                    Country:
                    <span class="fw-lighter text-primary" th:text="${rightReport?.reportDetails?.countryCode}"></span>
                </p>
                <p class="mb-1 font-8">
                    Profiles:
                    <span class="fw-lighter text-primary" th:text="${rightReport?.reportDetails?.profile}"></span>
                </p>
                <p class="mb-1 font-8">
                    Environment:
                    <span class="fw-lighter text-primary" th:text="${rightReport?.reportDetails?.environment}"></span>
                </p>
                <p class="mb-1 font-8">
                    Instance:
                    <span class="fw-lighter text-primary" th:text="${rightReport?.reportDetails?.instance}"></span>
                </p>
            </th>
        </tr>
        <tr>
            <td colspan="4" class="p-0">
                <table id="overallDiffTable" class="diff-table font-monospace small mb-0 table table-hover table-borderless">
                    <colgroup>
                        <col class="col-num">
                        <col class="col-code">
                        <col class="col-num">
                        <col class="col-code">
                    </colgroup>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(displayList)}">
                        <td class="blob-num context-num">1</td>
                        <td class="blob-code context-code">Data not found!</td>
                        <td class="blob-num context-num">1</td>
                        <td class="blob-code context-code">Data not found!</td>
                    </tr>
                    <tr th:each="dis,iterStat : ${displayList}"
                        th:classappend="${dis?.left?.deltaType == 'EQUAL'} ? 'overall-equal'">
                        <td class="blob-num context-num" th:text="${iterStat?.index + 1}"></td>

                        <td th:if="${#strings.isEmpty(dis?.left?.value)}" class="empty-line"></td>
                        <td th:unless="${#strings.isEmpty(dis?.left?.value)}"
                            th:class="|blob-code context-code ${dis?.left?.deltaType == 'DELETE' ? 'del-code' : ''}|">
                            <div>
                                <span style="white-space: pre-wrap"
                                      class="code-content"
                                      data-bs-toggle="popover" data-bs-trigger="click hover focus"
                                      data-bs-placement="top" data-bs-html="true"
                                      th:attrappend="data-bs-content=${!#strings.isEmpty(dis?.left?.origin)} ? '<i class=&quot;bi bi-file-earmark-code me-1&quot;></i>' + ${dis?.left?.origin} : null"
                                      th:utext="${dis?.left?.value?: ''} + ${!#strings.isEmpty(dis?.left?.origin) ? '<i class=&quot;ps-2 bi bi-file-earmark-code me-1&quot;></i>' : ''}"></span>
                            </div>
                        </td>

                        <td class="blob-num context-num" th:text="${iterStat?.index + 1}"></td>

                        <td th:if="${#strings.isEmpty(dis?.right?.value)}" class="empty-line"></td>
                        <td th:unless="${#strings.isEmpty(dis?.right?.value)}"
                            th:class="|blob-code context-code ${dis?.right?.deltaType == 'CHANGE' ? 'add-code' : ''}|">
                            <div>
                                <span style="white-space: pre-wrap"
                                      class="code-content"
                                      data-bs-toggle="popover" data-bs-trigger="click hover focus"
                                      data-bs-placement="top" data-bs-html="true"
                                      th:attrappend="data-bs-content=${!#strings.isEmpty(dis?.right?.origin)} ? '<i class=&quot;bi bi-file-earmark-code me-1&quot;></i>' + ${dis?.right?.origin} : null"
                                      th:utext="${dis?.right?.value?: ''} + ${!#strings.isEmpty(dis?.right?.origin) ? '<i class=&quot;ps-2 bi bi-file-earmark-code me-1&quot;></i>' : ''}"></span>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</html>
