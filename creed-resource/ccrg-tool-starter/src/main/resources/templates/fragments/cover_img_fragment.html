<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <th:block th:fragment="icon(path)">
        <th:block th:if="${bootstrapPath} != null">
            <th:block th:switch="${path}">
                <img style="background: #1234c6;" th:case="logo-infinity.svg" class="align-baseline" th:src="${bootstrapPath?.profileImg}">
                <img th:case="*" class="img-limit align-baseline">
            </th:block>
        </th:block>
        <th:block th:unless="${bootstrapPath} != null">
            <img class="align-baseline" th:style="${path == 'logo-infinity.svg' ? 'background: #1234c6;' : ''}" th:class="${path == 'profile.jpg' ? 'align-baseline' : 'img-limit align-baseline'}" th:src="@{${'/pdf/img/'+path}}">
        </th:block>
    </th:block>
</html>
