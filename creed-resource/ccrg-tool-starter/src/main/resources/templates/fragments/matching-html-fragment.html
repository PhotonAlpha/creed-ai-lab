<!--/*@thymesVar id="reportPropertiesOverview" type="com.creed.parent.controller.vo.ReportPropertiesOverviewVo"*/-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="matchingHtml">
    <table class="table table-hover table-borderless"
           th:with="leftReport=${reportPropertiesOverview?.matchingPropertiesOverview?.leftPropertyReview},rightReport=${reportPropertiesOverview?.matchingPropertiesOverview?.rightPropertyReview},displayList=${reportPropertiesOverview?.matchingPropertiesOverview?.displayList}"
           style="table-layout: fixed; word-break: break-all; word-wrap: break-word; ">

        <colgroup>
            <col style="width: 40px;">
            <col style="width: auto;">
            <col style="width: 40px;">
            <col style="width: auto;">
        </colgroup>

        <tbody>
        <tr>
            <th scope="col" colspan="4" class="text-center">
                <div class="alert alert-primary mb-0" role="alert">
                    Matching Data
                </div>
            </th>
        </tr>
        <tr>
            <th scope="col" colspan="2" class="border-bottom">
                <p class="mb-1 font-8">
                    Country:
                    <span class="fw-lighter text-primary" th:text="${leftReport?.reportDetails?.countryCode}"></span>
                </p>
                <p class="mb-1 font-8">
                    Profiles:
                    <span class="fw-lighter text-primary" th:text="${leftReport?.reportDetails?.profile}"></span>
                </p>
                <p class="mb-1 font-8">
                    Environment:
                    <span class="fw-lighter text-primary" th:text="${leftReport?.reportDetails?.environment}"></span>
                </p>
                <p class="mb-1 font-8">
                    Instance:
                    <span class="fw-lighter text-primary" th:text="${leftReport?.reportDetails?.instance}"></span>
                </p>
                <p class="font-6 mb-1">
                    Files Considered for Comparison:
                <p class="font-6 mb-1" th:each="str : ${#strings.listSplit(leftReport?.reportDetails?.fileNames,',')}">
                    <span class="fw-lighter text-primary" th:text="${str}"></span>
                </p>
                </p>
            </th>
            <th scope="col" colspan="2" class="border-bottom">
                <p class="mb-1 font-8">
                    Country:
                    <span class="fw-lighter text-primary" th:text="${rightReport?.reportDetails?.countryCode}"></span>
                </p>
                <p class="mb-1 font-8">
                    Profiles:
                    <span class="fw-lighter text-primary" th:text="${rightReport?.reportDetails?.profile}"></span>
                </p>
                <p class="mb-1 font-8">
                    Environment:
                    <span class="fw-lighter text-primary" th:text="${rightReport?.reportDetails?.environment}"></span>
                </p>
                <p class="mb-1 font-8">
                    Instance:
                    <span class="fw-lighter text-primary" th:text="${rightReport?.reportDetails?.instance}"></span>
                </p>
                <p class="font-6 mb-1">
                    Files Considered for Comparison:
                    <!--TODO-->
                <p class="font-6 mb-1" th:each="str : ${#strings.listSplit(rightReport?.reportDetails?.fileNames,',')}">
                    <span class="fw-lighter text-primary" th:text="${str}"></span>
                </p>
                </p>
            </th>
        </tr>
        <tr>
            <table class="diff-table font-monospace small mb-0 table table-hover table-borderless">
                <colgroup>
                    <col class="col-num">
                    <col class="col-code">
                    <col class="col-num">
                    <col class="col-code">
                </colgroup>
                <tbody>
                <tr th:each="dis,iterStat : ${displayList}">
                    <td class="blob-num" th:classappend="'context-num'" th:text="${iterStat?.index +1 }"></td>
                    <th:block th:if="${#strings.isEmpty(dis?.left?.value)}">
                        <td th:class="empty-line">
                        </td>
                    </th:block>
                    <th:block th:unless="${#strings.isEmpty(dis?.left?.value)}">
                        <td class="blob-code " th:classappend="'context-code'"
                            th:class="|${#strings.isEmpty(dis?.left?.value) ? 'empty-line' : ''} ${dis?.left?.deltaType == 'DELETE' ? 'del-code' : ''} ${dis?.left?.deltaType == 'CHANGE'  ? 'add-code': ''}|">
                            <div>
                                <span style="white-space: pre-wrap"
                                      class="code-content"
                                      data-bs-toggle="popover" data-bs-trigger="click hover focus"
                                      data-bs-placement="top" data-bs-html="true"
                                      th:attrappend="data-bs-content=${!#strings.isEmpty(dis?.left?.origin)} ? '<i class=&quot;bi bi-file-earmark-code me-1&quot;></i>' + ${dis?.left?.origin} : null"
                                      th:utext="${dis?.left?.value?: ''} + ${!#strings.isEmpty(dis?.left?.origin) ? '<i class=&quot;ps-2 bi bi-file-earmark-code me-1&quot;></i>' : ''}"></span>
                            </div>
                        </td>
                    </th:block>

                    <td class="blob-num" th:classappend="'context-num'" th:text="${iterStat?.index +1 }"></td>

                    <th:block th:if="${#strings.isEmpty(dis?.right?.value)}">
                        <td th:class="empty-line">
                        </td>
                    </th:block>
                    <th:block th:unless="${#strings.isEmpty(dis?.right?.value)}">
                        <td class="blob-code " th:classappend="'context-code'"
                            th:class="|${dis?.right?.deltaType == 'DELETE' ? 'del-code' : ''} ${dis?.right?.deltaType == 'CHANGE'  ? 'add-code': ''}|">
                            <div>
                                <span style="white-space: pre-wrap"
                                      class="code-content"
                                      data-bs-toggle="popover" data-bs-trigger="click hover focus"
                                      data-bs-placement="top" data-bs-html="true"
                                      th:attrappend="data-bs-content=${!#strings.isEmpty(dis?.right?.origin)} ? '<i class=&quot;bi bi-file-earmark-code me-1&quot;></i>' + ${dis?.right?.origin} : null"
                                      th:utext="${dis?.right?.value?: ''} + ${!#strings.isEmpty(dis?.right?.origin) ? '<i class=&quot;ps-2 bi bi-file-earmark-code me-1&quot;></i>' : ''}"></span>
                            </div>
                        </td>
                    </th:block>

                </tr>
                </tbody>
            </table>
        </tr>
        </tbody>
    </table>
</div>
</html>
