spring:
  config:
    import: "optional:configserver:"
  profiles:
    include: actuator

  # The only resource module with a real database. Credentials default to the local
  # creed-artifactory-db container (docker ps -> creed-artifactory-db, 127.0.0.1:5432);
  # the `env_matrix` database must exist before first start:
  #   docker exec creed-artifactory-db createdb -U artifactory env_matrix
  datasource:
    url: "${ENV_MATRIX_DB_URL:jdbc:postgresql://127.0.0.1:5432/env_matrix}"
    username: "${ENV_MATRIX_DB_USER:artifactory}"
    password: "${ENV_MATRIX_DB_PASSWORD:artifactory_pw}"
    hikari:
      pool-name: env-matrix-pool
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    # Flyway owns the schema; Hibernate must not touch it. Kept at `none` rather than `validate`
    # because validate rejects harmless type differences (timestamptz vs Instant) and would turn a
    # cosmetic mismatch into a failed startup.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Lets the module adopt a database that already has unrelated tables in it.
    baseline-on-migrate: true

  ssl:
    bundle:
      jks:
        creed-env-matrix-server:
          key:
            alias: creed-resource-env-matrix
          keystore:
            location: "file:${creed.rootPath}/creed-resource-env-matrix-keystore.p12"
            password: "${CREED_ENV_MATRIX_KEYSTORE_PASSWORD:changeit}"
            type: PKCS12
          truststore:
            location: "file:${creed.rootPath}/creed-resource-env-matrix-truststore.p12"
            password: "${CREED_ENV_MATRIX_TRUSTSTORE_PASSWORD:changeit}"
            type: PKCS12

# TomcatHttpsConfiguration (creed.https.enabled=true by default) wires the embedded HTTPS listener to
# the SSL bundle named by `creed.https.bundle`. The keystore is minted by
# .support/scripts/CA-Generation.sh, which now includes this service's identity.
creed:
  https:
    bundle: creed-env-matrix-server
  rootPath: ".support/scripts/pki" # relative to the repo root — run with -Dspring-boot.run.workingDirectory="$PWD"

env-matrix:
  conflict:
    # Where an address must be unique: TIER_ENV (default) | TIER | GLOBAL. See ConflictScope.
    scope: TIER_ENV
  health:
    # mock (default) | real. `mock` derives a stable state from host:port and touches no network;
    # `real` does a plain TCP connect to ip:port. The seeded matrix describes unreachable
    # environments, so `real` would report a uniform wall of DOWN.
    mode: mock
    timeout-ms: 800
    mock-seed: 0

  # Splunk session broker (/api/env-matrix/splunk/*): TOTP gate -> Splunk Web login -> cookie script.
  # See TotpProperties / SplunkProperties for every key.
  totp:
    # Base32 shared secret — what an authenticator app is enrolled with. Blank => the broker answers
    # 503. The fallback is a DEMO secret; set ENV_MATRIX_TOTP_SECRET for anything real.
    secret: "${ENV_MATRIX_TOTP_SECRET:JBSWY3DPEHPK3PXP}"
    period-seconds: 30
    digits: 6
    allowed-drift-steps: 1       # ±1 window = ±30 s of clock skew
    reject-replay: true
    # The Splunk page shows the current code on rotation. Anyone who can call
    # GET /splunk/totp/current can therefore pass the check — set false to require an authenticator.
    expose-current-code: "${ENV_MATRIX_TOTP_EXPOSE_CODE:true}"
    max-failures: 5
    failure-window: 60s
  splunk:
    # The switch for the real call. false (default): a fabricated cookie, no network. true: log in
    # to login-url for real and read the session cookie off the response.
    enabled: "${SPLUNK_ENABLED:false}"
    login-url: "${SPLUNK_LOGIN_URL:https://splunk.example.invalid:8000/en-US/account/login}"
    username: "${SPLUNK_USERNAME:admin}"
    # Prefer SPLUNK_PASSWORD or a {cipher} value from the config server over committing a password.
    password: "${SPLUNK_PASSWORD:admin}"
    session-cookie: splunkd_8000        # read from the login response
    script-cookie-name: splunkd_8089    # written by the copyable document.cookie script
    script-cookie-path: /
    prefetch-cval: true
    connect-timeout: 5s
    read-timeout: 15s
    # Optional SSL bundle whose truststore validates Splunk's certificate; blank => JDK default trust.
    ssl-bundle: ""
