# Module creed-order: one System, the Component that implements it, and the API it provides.
# Scaffolded by `corepack yarn catalog:new`. The API definition is the Redocly bundle in dist/ —
# edit paths/*.yml, then `corepack yarn openapi:build creed-order` and commit dist/ too.
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: creed-order
  title: Order
  description: Customer orders — CRUD plus the checkout used by creed-simple-metrics
  tags: [order]
spec:
  owner: group:default/creed-platform
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: creed-resource-order
  title: creed-resource-order
  description: Service implementing Order
  tags: [order]
spec:
  type: service
  lifecycle: experimental
  owner: group:default/creed-platform
  system: creed-order
  providesApis:
    - creed-order-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: creed-order-api
  title: Order API
  description: REST API of creed-resource-order
  tags: [order, rest]
spec:
  type: openapi
  lifecycle: experimental
  owner: group:default/creed-platform
  system: creed-order
  definition:
    # The single-file bundle of ./openapi.yaml + paths/*.yml (`corepack yarn openapi:build creed-order`),
    # committed. $text inserts it verbatim; ./openapi.yaml itself would reach Swagger UI with $refs.
    $text: ./dist/openapi.yaml
