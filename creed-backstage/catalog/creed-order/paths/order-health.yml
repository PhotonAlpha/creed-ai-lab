openapi: 3.1.0
info:
  title: Order — health
  version: 1.0.0
paths:
  /api/order/ping:
    get:
      tags: [health]
      summary: Liveness / echo — the load balancer's health-check path
      operationId: ping
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ping'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by creed-author-server
  schemas:
    Ping:
      type: object
      properties:
        service: { type: string, example: creed-resource-order }
        status: { type: string, example: UP }
        subject: { type: string, description: 'JWT subject, or `anonymous`', example: anonymous }
        time: { type: string, format: date-time }
