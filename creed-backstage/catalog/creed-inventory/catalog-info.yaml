# Module creed-inventory: one System, the Component that implements it, and the API it provides.
# Scaffolded by `corepack yarn catalog:new`. The API definition is the Redocly bundle in dist/ —
# edit paths/*.yml, then `corepack yarn openapi:build creed-inventory` and commit dist/ too.
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: creed-inventory
  title: Inventory
  description: Stock levels per warehouse
  tags: [inventory]
spec:
  owner: group:default/creed-platform
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: creed-resource-inventory
  title: creed-resource-inventory
  description: Service implementing Inventory
  tags: [inventory]
spec:
  type: service
  lifecycle: experimental
  owner: group:default/creed-platform
  system: creed-inventory
  providesApis:
    - creed-inventory-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: creed-inventory-api
  title: Inventory API
  description: REST API of creed-resource-inventory
  tags: [inventory, rest]
spec:
  type: openapi
  lifecycle: experimental
  owner: group:default/creed-platform
  system: creed-inventory
  definition:
    # The single-file bundle of ./openapi.yaml + paths/*.yml (`corepack yarn openapi:build creed-inventory`),
    # committed. $text inserts it verbatim; ./openapi.yaml itself would reach Swagger UI with $refs.
    $text: ./dist/openapi.yaml
