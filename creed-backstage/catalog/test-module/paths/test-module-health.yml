openapi: 3.1.0
info:
  title: Test Module — health
  version: 1.0.0
paths:
  /ping:
    get:
      tags: [health]
      summary: Liveness
      operationId: ping
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ping'
components:
  schemas:
    Ping:
      type: object
      properties:
        service: { type: string, example: creed-resource-test-module }
        status: { type: string, example: UP }
        time: { type: string, format: date-time }
