openapi: 3.1.0
info:
  title: Payment API
  version: 1.0.0
  description: creed-resource-payment — combined from catalog/creed-payment/paths/*.yml
servers:
  - url: https://localhost:18093
    description: primary (secondary is 18094)
paths:
  /api/payment/ping:
    get:
      tags:
        - health
      summary: Liveness / echo — the load balancer's health-check path
      operationId: ping
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ping'
  /api/payment:
    get:
      tags:
        - payments
      summary: List payments, optionally filtered by order and/or status
      operationId: listPayments
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: query
          schema:
            type: string
            example: ORD-900
        - name: status
          in: query
          description: Case-insensitive
          schema:
            $ref: '#/components/schemas/PaymentStatus'
      responses:
        '200':
          description: Matching payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
    post:
      tags:
        - payments
      summary: Initiate a payment — starts PENDING
      operationId: createPayment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Created, status PENDING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Amount missing or not positive, or unknown method
  /api/payment/checkout:
    post:
      tags:
        - payments
      summary: Create AND authorize in one call (creed-simple-metrics checkout chain)
      description: 'One call on purpose: each instance has its own in-memory store, so a create-then-authorize pair through a round-robin load balancer could land on different instances and 404.'
      operationId: checkoutPayment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Created, status AUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Amount missing or not positive, or unknown method
  /api/payment/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: PAY-700
    get:
      tags:
        - payments
      summary: Fetch one payment
      operationId: getPayment
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Unknown id
    put:
      tags:
        - payments
      summary: Replace a payment's mutable fields (omitted fields keep their value)
      operationId: updatePayment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: The updated payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Unknown id
    delete:
      tags:
        - lifecycle
      summary: Cancel — PENDING or AUTHORIZED only
      operationId: cancelPayment
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Now CANCELLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Unknown id
        '409':
          description: Already captured or refunded — money moved, use /refund
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
  /api/payment/{id}/authorize:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - lifecycle
      summary: PENDING → AUTHORIZED
      operationId: authorizePayment
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Moved'
        '404':
          description: Unknown id
        '409':
          $ref: '#/components/responses/WrongState'
  /api/payment/{id}/capture:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - lifecycle
      summary: AUTHORIZED → CAPTURED
      operationId: capturePayment
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Moved'
        '404':
          description: Unknown id
        '409':
          $ref: '#/components/responses/WrongState'
  /api/payment/{id}/refund:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - lifecycle
      summary: CAPTURED → REFUNDED
      operationId: refundPayment
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Moved'
        '404':
          description: Unknown id
        '409':
          $ref: '#/components/responses/WrongState'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by creed-author-server
  schemas:
    Ping:
      type: object
      properties:
        service:
          type: string
          example: creed-resource-payment
        status:
          type: string
          example: UP
        subject:
          type: string
          description: JWT subject, or `anonymous`
          example: anonymous
        time:
          type: string
          format: date-time
    PaymentStatus:
      type: string
      enum:
        - PENDING
        - AUTHORIZED
        - CAPTURED
        - REFUNDED
        - FAILED
        - CANCELLED
    PaymentMethod:
      type: string
      enum:
        - CARD
        - BANK_TRANSFER
        - WALLET
    Payment:
      type: object
      properties:
        id:
          type: string
          example: PAY-700
        orderId:
          type: string
          example: ORD-900
        customer:
          type: string
          example: Alice
        amount:
          type: number
          example: 42.5
        currency:
          type: string
          description: ISO 4217
          example: SGD
        method:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        createdAt:
          type: string
          format: date-time
    PaymentRequest:
      type: object
      description: Every field optional, so an update can be partial. Create defaults currency to SGD, method to CARD.
      properties:
        orderId:
          type: string
        customer:
          type: string
        amount:
          type: number
          exclusiveMinimum: 0
        currency:
          type: string
          default: SGD
        method:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          $ref: '#/components/schemas/PaymentStatus'
  responses:
    Moved:
      description: Transitioned
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Payment'
    WrongState:
      description: Not in the required state; the body is the payment unchanged
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Payment'
