# 可选：给 Dashboards 套一层 Basic Auth。默认不启用。
#
# 启用步骤（RHEL）：
#   1. dnf install -y nginx
#   2. 生成密码文件（不需要 httpd-tools）:
#        printf 'admin:%s\n' "$(openssl passwd -apr1)" > /etc/nginx/logstack.htpasswd
#        chown root:nginx /etc/nginx/logstack.htpasswd && chmod 0640 /etc/nginx/logstack.htpasswd
#   3. Dashboards 只听本机: config/opensearch_dashboards.yml 里 server.host 改成 "127.0.0.1"
#      然后 sudo ./install.sh --config-only && systemctl restart opensearch-dashboards
#   4. cp optional/nginx-basic-auth.conf /etc/nginx/conf.d/logstack.conf
#      nginx -t && systemctl enable --now nginx
#   5. SELinux: setsebool -P httpd_can_network_connect 1   （允许 nginx 连 127.0.0.1:5601）
#   6. 防火墙: 5601 仍只放行办公网段（firewall.sh 不用改，nginx 就监听 5601）
#
# 只是 Basic Auth，密码明文（base64）在网络上传输。办公网之外访问请同时配置 TLS（见下方注释的 server 块）。

server {
    listen      10.0.0.50:5601;   # TODO: 主机内网 IP。不要写 0.0.0.0，会和 Dashboards 的 127.0.0.1:5601 冲突
    server_name _;

    auth_basic           "logstack";
    auth_basic_user_file /etc/nginx/logstack.htpasswd;

    client_max_body_size 50m;     # 导入 saved objects 等

    location / {
        proxy_pass         http://127.0.0.1:5601;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}

