# Served to creed-resource-catalog via spring.config.import=configserver:...
#
# Requirement 2: enable HTTPS using an SSL bundle whose definition is delivered
#                here by the config server (the client only ships the CA truststore
#                it needs to bootstrap the connection to this config server).
# Requirement 6: the PKCS12 keystore/truststore password is stored as a {cipher}
#                value, encrypted with the config server's RSA public key. The config
#                server decrypts it with the matching private key BEFORE serving, so
#                the resource server receives only plaintext.
#
# Regenerate the cipher after rotating config-encrypt.p12:
#   curl -k -u creed-config:configpass https://localhost:8443/config-server/encrypt -d 'changeit'
creed:
  ssl:
    keystore-password: '{cipher}'

server:
  ssl:
    bundle: creed-jks-server

spring:
  ssl:
    bundle:
      jks:
        creed-jks-server:
          key:
            alias: server
          keystore:
            location: "classpath:certs/server-keystore.p12"
            password: "${creed.ssl.keystore-password}"
            type: PKCS12
          truststore:
            location: "classpath:certs/truststore.p12"
            password: "${creed.ssl.keystore-password}"
            type: PKCS12
