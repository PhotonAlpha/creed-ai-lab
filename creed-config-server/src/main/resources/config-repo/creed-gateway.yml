# Served to creed-gateway via spring.config.import=configserver:...
#
# Requirement 4: enable the gateway's own HTTPS listener from an SSL bundle defined here.
# Requirement 5: route to the resource servers through Spring Cloud LoadBalancer (lb://),
#                trusting their certificates via the creed-jks-client bundle.
# Requirement 6: the PKCS12 keystore/truststore password is delivered as a {cipher} value,
#                decrypted by the config server before this document is served.
creed:
  ssl:
    keystore-password: '{cipher}'
  resource:
    catalog-url: lb://catalog-resource/api/catalog/items
    order-url: lb://order-resource/api/order/items

server:
  ssl:
    bundle: creed-jks-server

spring:
  ssl:
    bundle:
      jks:
        # Gateway's own HTTPS listener.
        creed-jks-server:
          key:
            alias: server
          keystore:
            location: "classpath:certs/server-keystore.p12"
            password: "${creed.ssl.keystore-password}"
            type: PKCS12
          truststore:
            location: "classpath:certs/truststore.p12"
            password: "${creed.ssl.keystore-password}"
            type: PKCS12
        # Used by the gateway HttpClient and the @LoadBalanced WebClient to trust the
        # resource servers (and present a client cert if they ever require mTLS).
        creed-jks-client:
          key:
            alias: client
          keystore:
            location: "classpath:certs/client-keystore.p12"
            password: "${creed.ssl.keystore-password}"
            type: PKCS12
          truststore:
            location: "classpath:certs/truststore.p12"
            password: "${creed.ssl.keystore-password}"
            type: PKCS12
  cloud:
    # Static service registry backing Spring Cloud LoadBalancer (no Eureka/Consul needed).
    # lb://catalog-resource -> https://localhost:8081, lb://order-resource -> https://localhost:8082.
    discovery:
      client:
        simple:
          instances:
            catalog-resource:
              - uri: https://localhost:8081
            order-resource:
              - uri: https://localhost:8082
    gateway:
      server:
        webflux:
          httpclient:
            ssl:
              # Requirement 5: gateway routes trust the resource servers via this bundle.
              ssl-bundle: creed-jks-client
          routes:
            - id: catalog-resource
              uri: lb://catalog-resource
              predicates:
                - Path=/api/catalog/**
            - id: order-resource
              uri: lb://order-resource
              predicates:
                - Path=/api/order/**