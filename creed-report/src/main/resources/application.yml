server:
  port: 9100
  servlet:
    context-path: /report

spring:
  application:
    name: creed-report
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html


management:
  endpoints:
    web:
      exposure:
        include: "*"
    access:
      default: unrestricted
  defaults:
    metrics:
      export:
        enabled: on

  endpoint:
    configprops:
      access: unrestricted
      show-values: always
    env:
      access: unrestricted
      show-values: always