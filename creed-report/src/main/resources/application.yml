server:
  port: 9100
  servlet:
    context-path: /report

spring:
  # Jackson 3 (Boot 4) changed defaults the APIs were written against - e.g. FAIL_ON_NULL_FOR_PRIMITIVES
  # is on, so a body omitting a boolean field is a 400. Keep Jackson 2's until each API is reviewed.
  jackson:
    use-jackson2-defaults: true
  application:
    name: creed-report
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html
  # No spring.messages.* here: com.creed.report.config.MessageSourceConfig defines the
  # 'messageSource' bean (one per domain, chained), so MessageSourceAutoConfiguration backs off
  # and these properties would be silently ignored. Basenames/encoding live in that class.
  mail:
    host: smtp.qq.com
    port: 465
    protocol: smtp
    username: ethan.caoq@foxmail.com
    # QQ Mail authorization code (not the account password); never commit it here.
    password: ${CREED_MAIL_PASSWORD:}
    # 465 is implicit TLS: without this the client waits for a plain-text greeting that never comes.
    # (For 587 use properties.mail.smtp.starttls.enable instead, and leave this off.)
    ssl:
      enabled: true
    properties:
      # JavaMail's default is no timeout at all: a wrong port/SSL setting hangs instead of failing.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  profiles:
    group:
      "default":
        - "adc"
      "sit-order":
        - "default"
        - "global"
        - "jpa"
        - "order"
        - "extra"
      "sit-catalog":
        - "global"
        - "jpa"
        - "catalog"
        - "extra"
    include:
      - "sit-order2"
  config:
    import: "file:${home.path}/configs/application/creed-resource-catalog/"

home:
  path: "/Users/ethan/Desktop/workspace/sourcecode/github_space/creed-ai-lab"

creed:
  report:
    # /api/mail/probe sends REAL mail; this caps one call (a typo of 500 is 500 mails).
    mail-probe:
      max-messages: "${CREED_REPORT_MAIL_PROBE_MAX:10}"
    pdf:
      # Fonts registered for PDF export (Spring resource patterns or plain file paths).
      # Bundled: Noto Sans (Latin) + Noto Sans SC/TC (Chinese), picked per locale by the
      # pdf.font.family message key. This matches the code default; listed here for visibility.
      font-paths: "classpath:/fonts/*.ttf,classpath:/fonts/*.otf"
      # Logo drawn in the PDF running header and footer (every page). PNG/JPEG/GIF only -- the
      # renderer has no SVG support -- and it is inlined as a data: URI, because openpdf-html gets
      # the document as a string and so has no base URL to resolve an image path against.
      # `logo` is used where the background is white (the footer); `logo-inverse` is the knockout
      # variant for the dark header bar and falls back to `logo` when absent.
      logo: "${CREED_REPORT_PDF_LOGO:classpath:/static/img/creed-logo.png}"
      logo-inverse: "${CREED_REPORT_PDF_LOGO_INVERSE:classpath:/static/img/creed-logo-inverse.png}"
      # Seal stamped into the statement layout's running footnote (template=statement). Same rules
      # as the logos -- PNG/JPEG/GIF, inlined as a data: URI -- but NO fallback to the logo: a
      # missing seal prints nothing rather than putting the brand mark where a seal belongs.
      stamp: "${CREED_REPORT_PDF_STAMP:classpath:/static/img/creed-stamp.png}"
    # Country axis: ?country=global|th|my|vn, remembered in the creed-report-country cookie and
    # folded into the request locale's region subtag by CountryLocaleResolver. The per-country
    # presentation defaults live in the ReportCountry enum; `profiles` below overrides individual
    # fields of one country and may be omitted entirely (see the commented example).
    country:
      default-country: "${CREED_REPORT_DEFAULT_COUNTRY:global}"
    # Guard rails for /dynamic, whose table comes from the caller: POI and openpdf-html lay the
    # whole thing out in memory, so an oversized payload is refused as bad input (400).
    dynamic:
      max-columns: "${CREED_REPORT_DYNAMIC_MAX_COLUMNS:64}"
      max-rows: "${CREED_REPORT_DYNAMIC_MAX_ROWS:20000}"
#      profiles:
#        my:
#          date-pattern: "dd-MM-yyyy HH:mm"
#          languages: [ "ms", "en" ]

logging:
  level:
    org.springframework.boot.context.config.ConfigDataEnvironment: trace
    # JavaMail's own log, bridged JUL -> Logback by Boot (so it carries thread name + timestamp,
    # unlike mail.debug=true, which prints to System.out). One "connected to host" line per SMTP
    # connection; the protocol logger adds every command, incl. the QUIT that closes it.
    # AUTH stays hidden (mail.debug.auth defaults to false). DATA lines include the message body.
    org.eclipse.angus.mail.smtp: debug
    org.eclipse.angus.mail.smtp.protocol: trace

management:
  endpoints:
    web:
      exposure:
        include: "*"
    access:
      default: unrestricted
  defaults:
    metrics:
      export:
        enabled: on

  endpoint:
    configprops:
      access: unrestricted
      show-values: always
    env:
      access: unrestricted
      show-values: always