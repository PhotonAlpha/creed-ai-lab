# Country override bundle: Malaysia, in Malay
# Reached only through the locale's REGION subtag (ms_MY), which CountryLocaleResolver
# folds in from ?country=. It carries just the keys that differ per country -- everything
# else falls through to report-messages_ms.properties and then the base bundle.

report.country.name = Malaysia
report.country.notice = Tarikh ditulis hari dahulu dengan jam 12 jam (PG/PTG).
report.country.timezone = Asia/Kuala_Lumpur
