# Country override bundle: Thailand, in English
# Reached only through the locale's REGION subtag (en_TH), which CountryLocaleResolver
# folds in from ?country=. It carries just the keys that differ per country -- everything
# else falls through to report-messages_en (absent) -> base.properties and then the base bundle.

report.country.name = Thailand
report.country.notice = Dates use the Buddhist era (B.E. = C.E. + 543) and are written day-first.
report.country.timezone = Asia/Bangkok
