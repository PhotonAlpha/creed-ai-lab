# Country override bundle: Thailand, in Thai
# Reached only through the locale's REGION subtag (th_TH), which CountryLocaleResolver
# folds in from ?country=. It carries just the keys that differ per country -- everything
# else falls through to report-messages_th.properties and then the base bundle.

report.country.name = ประเทศไทย
report.country.notice = วันที่แสดงเป็นปีพุทธศักราช (พ.ศ. = ค.ศ. + 543) และเรียงแบบวัน/เดือน/ปี
report.country.timezone = Asia/Bangkok
