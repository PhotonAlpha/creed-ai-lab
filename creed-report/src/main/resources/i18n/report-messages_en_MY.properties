# Country override bundle: Malaysia, in English
# Reached only through the locale's REGION subtag (en_MY), which CountryLocaleResolver
# folds in from ?country=. It carries just the keys that differ per country -- everything
# else falls through to report-messages_en (absent) -> base.properties and then the base bundle.

report.country.name = Malaysia
report.country.notice = Dates are written day-first on a 12-hour clock (PG/PTG).
report.country.timezone = Asia/Kuala_Lumpur
