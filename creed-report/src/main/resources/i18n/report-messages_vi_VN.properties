# Country override bundle: Vietnam, in Vietnamese
# Reached only through the locale's REGION subtag (vi_VN), which CountryLocaleResolver
# folds in from ?country=. It carries just the keys that differ per country -- everything
# else falls through to report-messages_vi.properties and then the base bundle.

report.country.name = Việt Nam
report.country.notice = Ngày ghi theo thứ tự ngày/tháng/năm; số được nhóm bằng dấu chấm (1.234).
report.country.timezone = Asia/Ho_Chi_Minh
