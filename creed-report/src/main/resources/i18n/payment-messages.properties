# Payment domain bundle (English default). Second basename in the MessageSourceConfig chain —
# keys are prefixed payment.* so they can never collide with the report.*/pdf.*/html.* keys in
# report-messages. Mirrors creed-resource-payment's lifecycle: PENDING -> AUTHORIZED -> CAPTURED
# -> REFUNDED, plus CANCELLED.
payment.status.pending = Pending
payment.status.authorized = Authorized
payment.status.captured = Captured
payment.status.refunded = Refunded
payment.status.cancelled = Cancelled

payment.col.reference = Reference
payment.col.amount = Amount
payment.col.currency = Currency
payment.col.status = Status
