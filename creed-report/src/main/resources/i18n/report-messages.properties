# --- country axis -----------------------------------------------------------------------------
# report.countrySwitch.* and report.lang.* are autonyms: a switcher shows every choice in its own
# language, so they are deliberately defined ONLY here and never translated in another bundle.
report.countryLabel = Country
report.languageLabel = Language
report.countrySwitch.global = Global
report.countrySwitch.th = ไทย
report.countrySwitch.my = Malaysia
report.countrySwitch.vn = Việt Nam
report.lang.en = English
report.lang.zh-CN = 简体中文
report.lang.zh-TW = 繁體中文
report.lang.th = ไทย
report.lang.ms = Bahasa Melayu
report.lang.vi = Tiếng Việt

# report.country.* describe the country currently being rendered. The values here are GLOBAL's;
# every other country overrides them in a region bundle (report-messages_<lang>_<REGION>.properties)
# which is reached purely through the locale's region subtag -- see ReportCountry.
report.country.name = Global
report.country.notice = All regions. Timestamps in ISO order (yyyy-MM-dd), server local time.
report.country.timezone = UTC
report.country.timezoneLabel = Timezone
report.country.formatLabel = Format

# --- dynamic table report (com.creed.report.dynamic) ------------------------------------------
# Columns are named by KEY, and each key's label is looked up as report.col.<key> -- the same keys
# the server report above uses -- so headers=host,ip,app comes out translated for free. A key with
# no message here shows verbatim, which is what makes an ad-hoc column work.
report.type.dynamic = Dynamic Table
excel.sheet.dynamic = Data
report.dynamic.pageTitle = Creed Dynamic Report
report.dynamic.offlineTitle = Creed Dynamic Report (Offline)
report.dynamic.defaultTitle = Dynamic Table Report
report.dynamic.titleLabel = Report title
report.dynamic.headersLabel = Headers
report.dynamic.headersHint = Comma-separated column keys, e.g. host,ip,app,country. Known keys are translated; write key:Label to name one yourself.
report.dynamic.dataLabel = Rows (JSON)
report.dynamic.dataHint = A JSON array — objects keyed by header, or arrays in header order.
report.dynamic.render = Render
