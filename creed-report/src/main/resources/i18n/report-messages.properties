# Default bundle (English) for the PDF export. pdf.font.family is the per-locale CSS font stack
# injected into report-export-pdf.html — each locale leads with the Noto face that covers its
# script (Noto Sans / Noto Sans SC / Noto Sans TC, bundled under classpath:/fonts/).
# pdf.page.* are the @bottom-right page-counter fragments; unicode space escapes keep meaningful
# edge spaces — .properties trims leading whitespace on load, editors trim trailing on save.
pdf.font.family = 'Noto Sans', Helvetica, sans-serif
pdf.page.header = Creed - Server Inventory Report
pdf.page.prefix = Page\u0020
pdf.page.middle = \u0020of\u0020
pdf.page.suffix = 

report.title = Creed Server Report (PDF)
report.brand = Creed · Server Inventory Report
report.generatedAt = Generated at
report.pdfSnapshot = PDF snapshot
report.topology = Server Topology
report.columns = Host / IP / App / Country / Service / Env / Zone / Slot
report.total = Total
report.col.host = Host
report.col.ip = IP
report.col.app = App
report.col.country = Country
report.col.service = Service
report.col.env = Env
report.col.zone = Zone
report.col.slot = Slot
report.empty = No server records.
report.footer = Powered by Spring Boot · Thymeleaf · openpdf-html · PDF export

# HTML view / offline HTML export. html.font.family is a browser stack: browsers do per-glyph
# fallback, so the locale just leads with its preferred Noto face; fonts are not embedded.
html.font.family = 'Noto Sans', 'Noto Sans SC', 'Noto Sans TC', system-ui, -apple-system, 'Segoe UI', sans-serif
report.htmlTitle = Creed Server Report
report.offlineTitle = Creed Server Report (Offline)
