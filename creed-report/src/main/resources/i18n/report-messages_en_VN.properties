# Country override bundle: Vietnam, in English
# Reached only through the locale's REGION subtag (en_VN), which CountryLocaleResolver
# folds in from ?country=. It carries just the keys that differ per country -- everything
# else falls through to report-messages_en (absent) -> base.properties and then the base bundle.

report.country.name = Vietnam
report.country.notice = Dates are written day-first; counts group with dots (1.234).
report.country.timezone = Asia/Ho_Chi_Minh
