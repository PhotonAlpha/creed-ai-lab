<!DOCTYPE html>
<!-- The live report page, rendered for one country edition in one language.

     Country and language arrive folded into the request locale by CountryLocaleResolver; the
     controller hands the resolved CountryProfile in as ${profile}. Everything country-specific on
     this page goes through it: the body class picks the country's style block, ${profile.code}
     the row scope / date / count formats were applied upstream, and the country's own stylesheet
     and fragment template are pulled in BY PATH from ${profile} — no branching, no fragment-name
     mangling, one directory per country (see ReportCountry).
     The header and footer come from fragments/report-chrome and are identical in every country. -->
<html lang="en" th:lang="${profile.languageTag()}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{report.htmlTitle}">Creed Server Report</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/report.css}">
    <!-- Last, so the country's palette wins; only ever one country's sheet is loaded. -->
    <link rel="stylesheet" th:href="@{${profile.styleSheet}}">
    <th:block th:replace="~{fragments/report-chrome :: styles}"></th:block>
</head>
<body th:class="${profile.styleClass()}">

<nav th:replace="~{fragments/report-chrome :: header(${profile}, ${generatedAt}, null, ${countries})}"></nav>

<div class="container my-4">

    <!-- The country's own block: different markup per country, same source of text. Selected by
         template path, so the fragment name is the same in every country and a country's file can
         grow more fragments without colliding with anyone else's. -->
    <div th:replace="~{${profile.contentTemplate} :: notice}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="mb-1 content-accent" th:text="#{report.topology}">Server Topology</h4>
            <p class="text-muted mb-0" th:text="#{report.columns}">
                Host / IP / App / Country / Service / Env / Zone / Slot
            </p>
        </div>
        <div class="d-flex align-items-center gap-2">
            <span class="badge total-badge fs-6">
                <span th:text="#{report.total}">Total</span>: <span th:text="${total}">0</span>
            </span>
            <!-- The exports carry no query string: both axes are remembered in cookies, so a
                 download is always the edition currently on screen. -->
            <a class="btn btn-primary btn-sm" th:href="@{/export}" download
               th:text="#{report.downloadOffline}">
                Download offline HTML
            </a>
            <a class="btn btn-outline-primary btn-sm" th:href="@{/export/pdf}" download
               th:text="#{report.downloadPdf}">
                Download PDF
            </a>
            <!-- Excel export. The split button downloads this page's report; the dropdown lists
                 every registered export strategy (model attribute reportTypes), so ?type= picks
                 which ExcelReportExporter runs. -->
            <div class="btn-group btn-group-sm">
                <a class="btn btn-success" th:href="@{/export/excel(type='server')}" download
                   th:text="#{report.downloadExcel}">
                    Download Excel
                </a>
                <button type="button" class="btn btn-success dropdown-toggle dropdown-toggle-split"
                        data-bs-toggle="dropdown" aria-expanded="false">
                    <span class="visually-hidden" th:text="#{report.downloadExcel}">Download Excel</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li th:each="rt : ${reportTypes}">
                        <a class="dropdown-item" download
                           th:href="@{/export/excel(type=${rt.code})}"
                           th:text="#{${rt.titleKey}}">Report type</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0 report-table">
                    <thead class="table-dark">
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col" th:text="#{report.col.host}">Host</th>
                        <th scope="col" th:text="#{report.col.ip}">IP</th>
                        <th scope="col" th:text="#{report.col.app}">App</th>
                        <th scope="col" th:text="#{report.col.country}">Country</th>
                        <th scope="col" th:text="#{report.col.service}">Service</th>
                        <th scope="col" th:text="#{report.col.env}">Env</th>
                        <th scope="col" th:text="#{report.col.zone}">Zone</th>
                        <th scope="col" th:text="#{report.col.slot}">Slot</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s, iter : ${servers}">
                        <th scope="row" th:text="${iter.count}">1</th>
                        <td th:text="${s.host}">creed-host</td>
                        <td><code class="ip" th:text="${s.ip}">0.0.0.0</code></td>
                        <td th:text="${s.app}">creed-app</td>
                        <td>
                            <span class="badge bg-light text-dark border" th:text="${s.country}">CN</span>
                        </td>
                        <td th:text="${s.service}">service</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${'badge-env-' + s.env}"
                                  th:text="${s.env}">env</span>
                        </td>
                        <td th:text="${s.zone}">zone</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${'badge-slot-' + s.slot}"
                                  th:text="${s.slot}">slot</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(servers)}">
                        <td colspan="9" class="text-center text-muted py-4" th:text="#{report.empty}">No server records.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <p th:replace="~{fragments/report-chrome :: footer(#{report.footerWeb})}"></p>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
