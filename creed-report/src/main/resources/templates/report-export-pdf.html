<!DOCTYPE html>
<!-- PDF twin of report-export.html: the server inventory as paged media. All the chrome -- the
     @page margin boxes, the base CSS 2.1, the header, the heading row and the footer -- comes from
     fragments/report-chrome-pdf, shared with dynamic-report-export-pdf.html, so the two PDF reports
     cannot drift apart. What is left here is this report's own table.
     Model: profile / countryPdfCss / servers / total / generatedAt.

     Localized on two axes. Language: display strings and the CSS font stack come from
     messages*.properties. Country: the edition's markup and CSS are pulled in BY PATH from
     ${profile} -- ${profile.pdfContentTemplate} for the fragment, CountryStyles for the inlined
     stylesheet -- so this template never branches on the country. -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{report.title}">Creed Server Report (PDF)</title>
    <th:block th:replace="~{fragments/report-chrome-pdf :: styles}"></th:block>
<!-- The country edition's own CSS 2.1 rules, inlined by CountryStyles (openpdf-html renders from a
     string, so there is no base URL for a <link>). After the base block, so its palette wins; only
     this country's sheet is ever inlined. Source: static/css/country/<code>/style-pdf.css. -->
<style th:utext="${countryPdfCss}">/* country pdf css inlined here */</style>
</head>
<body th:class="${profile.styleClass()}">

<div th:replace="~{fragments/report-chrome-pdf :: header(#{report.brand}, ${generatedAt})}"></div>

<div th:replace="~{${profile.pdfContentTemplate} :: notice}"></div>

<div th:replace="~{fragments/report-chrome-pdf :: section(#{report.topology}, #{report.columns}, ${total})}"></div>

<div class="card">
    <table class="report-table">
        <thead>
        <tr>
            <th>#</th>
            <th th:text="#{report.col.host}">Host</th>
            <th th:text="#{report.col.ip}">IP</th>
            <th th:text="#{report.col.app}">App</th>
            <th th:text="#{report.col.country}">Country</th>
            <th th:text="#{report.col.service}">Service</th>
            <th th:text="#{report.col.env}">Env</th>
            <th th:text="#{report.col.zone}">Zone</th>
            <th th:text="#{report.col.slot}">Slot</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s, iter : ${servers}" th:classappend="${iter.odd} ? 'odd'">
            <th th:text="${iter.count}">1</th>
            <td th:text="${s.host}">creed-host</td>
            <td><code class="ip" th:text="${s.ip}">0.0.0.0</code></td>
            <td th:text="${s.app}">creed-app</td>
            <td><span class="badge badge-country" th:text="${s.country}">CN</span></td>
            <td th:text="${s.service}">service</td>
            <td>
                <span class="badge" th:classappend="${'badge-env-' + s.env}" th:text="${s.env}">env</span>
            </td>
            <td th:text="${s.zone}">zone</td>
            <td>
                <span class="badge" th:classappend="${'badge-slot-' + s.slot}" th:text="${s.slot}">slot</span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(servers)}" class="empty-row">
            <td colspan="9" th:text="#{report.empty}">No server records.</td>
        </tr>
        </tbody>
    </table>
</div>

<p th:replace="~{fragments/report-chrome-pdf :: footer}"></p>

</body>
</html>
