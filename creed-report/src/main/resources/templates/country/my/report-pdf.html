<!DOCTYPE html>
<!-- Malaysia edition -- report fragments for the PDF export, pulled in the same way:

         <div th:replace="~{${profile.pdfContentTemplate} :: notice}"></div>

     Rebuilt for openpdf-html (Flying Saucer): CSS 2.1 only, so no Bootstrap utilities, no flexbox
     and no definition-list grid -- the same layout expressed with tables and floats. Text comes
     from the same region bundles as the browser fragments, so the two cannot drift apart. -->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- One line, timezone floated right (no flexbox here). -->
<div th:fragment="notice" class="country-notice">
    <span class="country-notice-chip" th:text="#{report.country.timezone}">Asia/Kuala_Lumpur</span>
    <span class="country-notice-title" th:text="#{report.country.name}">Malaysia</span>
    <span class="country-notice-body" th:text="#{report.country.notice}">Dates are day-first.</span>
    <div class="clearfix"></div>
</div>
</body>
</html>
