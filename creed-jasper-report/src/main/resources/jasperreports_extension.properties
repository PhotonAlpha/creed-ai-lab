# JasperReports font extension registration.
#
# This is how a .jrxml gets to say fontName="Creed Sans" and have the engine hand it an embedded
# Noto face -- the counterpart of creed-report registering its TTFs on every ITextRenderer in
# PdfExportService. Declarative rather than code, so nothing has to run before a fill: the engine
# finds this file on the classpath at first use.
# The registry id is "simple.font.families" and it is NOT free-form: the factory reads the
# net.sf.jasperreports.extension.<id>.* properties under its own id, so a different id here
# registers a factory that then finds nothing to load -- and the only symptom is
# JRFontNotFoundException("Font \"Creed Sans\" is not available to the JVM") at the first fill.
net.sf.jasperreports.extension.registry.factory.simple.font.families=net.sf.jasperreports.engine.fonts.SimpleFontExtensionsRegistryFactory
net.sf.jasperreports.extension.simple.font.families.creed=fonts/creed-fonts.xml
