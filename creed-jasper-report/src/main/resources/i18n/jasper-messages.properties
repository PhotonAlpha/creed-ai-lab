# Default bundle (English) for the Jasper approval-status listing, loaded by the report's
# resourceBundle="i18n/jasper-messages" and resolved against REPORT_LOCALE.
#
# The KEY NAMES are creed-report's, deliberately: the two modules print the same strings in the
# same places, and a key that had been renamed on the way across would hide a wording drift.
#
# There are only three keys because almost every string in this document comes from the PAYLOAD
# (the title, the criteria captions, the record count, every cell) -- what is localized is the
# chrome around it. The font is NOT a key here the way it is in creed-report: JasperReports
# resolves a family against the locale itself, see fonts/creed-fonts.xml.
#
# pdf.page.middle keeps its meaningful edge spaces as unicode escapes -- .properties trims leading
# whitespace on load and editors trim trailing on save. The statement chrome prints "1 of 2", so
# this is the ONLY page-counter fragment used: no prefix, no suffix.
pdf.page.middle =  of 
report.statement.exportDate = Date of Export:
report.statement.exportTime = Time of Export:
