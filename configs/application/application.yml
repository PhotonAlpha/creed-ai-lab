spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/config-server
    username: root-server
    password: root-server-pwd
  thymeleaf:
    enabled: true
    cache: true
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: true
    cache-duration: 1h
