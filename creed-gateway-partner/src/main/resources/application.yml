server:
  port: 8095

spring:
  config:
    import: "optional:configserver:"
  application:
    name: creed-gateway-partner
  profiles:
    include: actuator
  cloud:
    # Requirement 1: static service registry backing Spring Cloud LoadBalancer (no Eureka/Consul).
    # Two instances per service; all HTTPS with self-signed certs (signed by the Creed CA), trusted
    # via the partner SSL bundle. The load balancer round-robins across the healthy instances.
    discovery:
      client:
        simple:
          instances:
            catalog-resource:
              - uri: https://localhost:8081
              - uri: https://localhost:8082
            order-resource:
              - uri: https://localhost:8091
              - uri: https://localhost:8092
    loadbalancer:
      # Requirement 2: only route to instances that pass a health check. The probe PATH now lives in
      # creed.partner.clusters.<name>.health-check.path (PartnerLoadBalancerConfiguration overrides the
      # framework path with the per-cluster value); only the scheduling stays here.
      health-check:
        initial-delay: 0s
        interval: 10s
  ssl:
    bundle:
      jks:
        # Inbound HTTPS listener identity (serverAuth cert).
        creed-partner-server:
          key:
            alias: creed-gateway-partner
          keystore:
            location: "file:${creed.rootPath}/creed-gateway-partner-keystore.p12"
            password: "${CREED_ORDER_KEYSTORE_PASSWORD:changeit}"
            type: PKCS12
          truststore:
            location: "file:${creed.rootPath}/creed-gateway-partner-truststore.p12"
            password: "${CREED_ORDER_TRUSTSTORE_PASSWORD:changeit}"
            type: PKCS12
        # Outbound identity for downstream resource-server calls (clientAuth -CLI cert);
        # truststore trusts the Creed CA so the resource servers' certificates are accepted.
        creed-partner-client:
          key:
            alias: creed-gateway-partner-cli
          keystore:
            location: "file:${creed.rootPath}/creed-gateway-partner-CLI-keystore.p12"
            password: "${CREED_ORDER_KEYSTORE_PASSWORD:changeit}"
            type: PKCS12
          truststore:
            location: "file:${creed.rootPath}/creed-gateway-partner-CLI-truststore.p12"
            password: "${CREED_ORDER_TRUSTSTORE_PASSWORD:changeit}"
            type: PKCS12


# Expose the metrics endpoint so the HttpClient 5 pool gauges (httpclient5.pool.connections.*)
# registered in PartnerClientConfiguration are visible via actuator.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# TomcatHttpsConfiguration (creed.https.enabled=true by default) wires the embedded
# HTTPS listener to the SSL bundle named by `creed.https.bundle`. Outside the `cloud`
# profile no bundle is delivered by the config server, so we define one locally here
# from the service's own PKCS12 keystore/truststore (generated by CA-Generation.sh).
creed:
  https:
    bundle: creed-partner-server
  partner:
    # One entry per downstream cluster. Each entry is turned by PartnerClientConfiguration#clusterClients
    # into a business pool + load-balanced/audited RestClient, a (smaller) health-check pool + RestClient,
    # and two Micrometer pool binders — so adding a cluster is a YAML edit, not four new @Bean methods.
    #
    # Keys per cluster:
    #   service-id    – load-balancer service-id (must match spring.cloud.discovery.client.simple.instances)
    #   client-bundle – SSL bundle for the mTLS downstream + health calls (default: creed-partner-client)
    #   path          – downstream business path; business URL = https://<service-id><path>
    #   http.*        – business pool tunables (max-total, max-per-route, *-timeout)
    #   health-check.path / health-check.http.* – probe path + the smaller health-check pool tunables
    clusters:
      catalog:
        service-id: catalog-resource
        client-bundle: creed-partner-client
        path: /api/catalog/items
        http:
          max-total: 50
          max-per-route: 20
          connect-timeout: 5s
          socket-timeout: 10s
          connection-request-timeout: 3s
          response-timeout: 10s
        health-check:
          path: /api/catalog/ping
          http:
            max-total: 10
            max-per-route: 5
            connect-timeout: 2s
            socket-timeout: 2s
            connection-request-timeout: 2s
            response-timeout: 2s
      order:
        service-id: order-resource
        client-bundle: creed-partner-client
        path: /api/order/items
        http:
          max-total: 50
          max-per-route: 20
          connect-timeout: 5s
          socket-timeout: 10s
          connection-request-timeout: 3s
          response-timeout: 10s
        health-check:
          path: /api/order/ping
          http:
            max-total: 10
            max-per-route: 5
            connect-timeout: 2s
            socket-timeout: 2s
            connection-request-timeout: 2s
            response-timeout: 2s
  rootPath: "/Users/ethan/Desktop/workspace/sourcecode/github_space/creed-ai-lab/.support/scripts/pki"