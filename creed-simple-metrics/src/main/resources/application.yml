server:
  port: 8096
  tomcat:
    mbeanregistry:
      enabled: true
    threads:
      max: 50
      min-spare: 10

spring:
  config:
    import: "optional:configserver:"
  application:
    name: creed-simple-metrics
  main:
    # The classic <camelContext> Spring XML registers the <threadPool> beans into the Spring graph,
    # which forms a cycle with camel-spring-boot's health-check registry auto-config
    # (threadPool -> camelContext -> HealthCheckRegistry -> threadPool). Allow it to be broken.
    allow-circular-references: true
  cloud:
    loadbalancer:
      health-check:
        interval: 1m
    # Static service registry backing Spring Cloud LoadBalancer (no Eureka/Consul). The
    # RemoteClusterProcessor calls https://<service-id>/... and the LB round-robins across these
    # healthy instances (all HTTPS with Creed-CA self-signed certs, trusted via the partner bundle).
    discovery:
      client:
        simple:
          instances:
            catalog-resource:
              - uri: https://localhost:18081
              - uri: https://localhost:18082
            order-resource:
              - uri: https://localhost:18091
              - uri: https://localhost:18092
            payment-resource:
              - uri: https://localhost:18093
                metadata:
                  stickyId: 27AE496060A84649E527E8533A185D1461286662457143FE306F422EF1FA2696
              - uri: https://localhost:18094
                metadata:
                  stickyId: 844D8CF83FBB091AB9E7F13E53E211668A36FE9761F3D22F593102CDE267A255
  # NOTE: the two mTLS SSL bundles (creed-partner-server / creed-partner-client) are no longer declared
  # here under spring.ssl.bundle.jks.*. They are registered PROGRAMMATICALLY in
  # com.creed.simple.web.ssl.SslBundleConfiguration, which also validates the keystore/truststore passwords
  # at startup (fail-fast) — property-defined bundles only load lazily on first use, hiding a bad password
  # until the first handshake. Paths/passwords remain externalised via creed.rootPath and the
  # CREED_ORDER_*_PASSWORD env vars.


# Apache Camel (Spring Boot) configuration.
# All routes/rests/threadPools live in camel-context.xml (classic <camelContext> Spring XML DSL),
# imported via @ImportResource. REST transport + JSON binding + inline-routes are configured there in
# <restConfiguration>; only the servlet mount point is a Spring Boot property.
camel:
  main:
    # Routes come from the inline <camelContext>, so disable camel-spring-boot's file/RouteBuilder
    # collector — otherwise it scans the default classpath:camel/* dirs for route files (and would need
    # camel-xml-io-dsl, which we dropped in favour of camel-spring-xml).
    routes-collector-enabled: false
  servlet:
    mapping:
      # CamelHttpTransportServlet mount point; APIs live under https://host:8096/camel/api/*
      context-path: /camel/*

# Expose the metrics endpoint so the HttpClient 5 pool gauges (httpclient5.pool.connections.*)
# registered in CamelHttpClientConfiguration are visible via actuator.
management:
  endpoints:
    web:
      exposure:
#        include: health,info,metrics,prometheus
        include: "*"
  tracing:
    sampling:
      # Trace every request (Boot defaults to 0.1 = 10%); 1.0 makes trace/span IDs show up in the
      # logs on every call. Lower this in production.
      probability: 1.0
  metrics:
    distribution:
      # Emit http_server_requests_seconds_bucket so the dashboard's HTTP latency panel can use
      # histogram_quantile (p95/p99). Off by default — without this only _count/_sum/_max exist.
      # Camel REST calls (/camel/api/*) flow through the same ServerHttpObservationFilter, so once
      # buckets are on AND CamelRestObservationConvention gives them a real uri, they show up here too.
      percentiles-histogram:
        http.server.requests: true
        # Outbound client latency (RestClient `http.client.requests`, emitted once the cluster/health
        # RestClients are wired with the ObservationRegistry — see LoadBalancedRestClientConfiguration).
        http.client.requests: true
      # Bound the bucket range so the histogram doesn't generate an excessive number of series.
      minimum-expected-value:
        http.server.requests: 1ms
        http.client.requests: 5ms
      maximum-expected-value:
        http.server.requests: 10s
        http.client.requests: 10s

# Zalando Logbook: request/response audit for BOTH directions — the auto-registered servlet
# filter (inbound /camel/*, replaces the legacy AuditLoggingFilter) and the LogbookHttpExecHandler
# on the two hc5 clients (downstream calls, see CamelConfig / CookieRelayRestClientConfiguration).
# Lines go to the `org.zalando.logbook.Logbook` logger at TRACE, routed to its own async appender —
# see logback-spring.xml's ASYNC_LOGBOOK. Extra tuning beyond plain properties (the request condition,
# the error-only-body Strategy) lives in web/LogbookAuditConfiguration.java.
logbook:
  predicate:
    exclude:
      - path: /actuator/**   # keep scrape traffic out of the audit log
  format:
    style: http               # readable multi-line blocks — good for local debugging; switch to
                               # `splunk` (single-line field=value) for production (alternatives: json, curl)
  obfuscate:
    headers:                 # same masking set as the legacy filter
      - Authorization
      - Proxy-Authorization
  write:
    max-body-size: 4096      # align with the legacy filter's MAX_PAYLOAD_BYTES; only truncates the
                              # WRITTEN content — the body is still fully buffered in memory up to that
                              # point (see creed.logbook.body-on-error below for the real fix)

# TomcatHttpsConfiguration (creed.https.enabled=true by default) wires the embedded
# HTTPS listener to the SSL bundle named by `creed.https.bundle`. Outside the `cloud`
# profile no bundle is delivered by the config server, so we define one locally here
# from the service's own PKCS12 keystore/truststore (generated by CA-Generation.sh).
creed:
  # LogbookAuditConfiguration's two extension points (Predicate<HttpRequest> "requestCondition" bean +
  # conditional Strategy bean) — kept as separate creed.logbook.* properties instead of overloading
  # logbook.* since they're this module's own additions, not Logbook's own config surface.
  logbook:
    # Ant-style path patterns to skip auditing entirely for (e.g. high-traffic/low-value endpoints);
    # empty here since this module's own hc5 traffic (fetch-catalog/order/payment, cookie-relay) has no
    # such path today — populate per-deployment.
    skip-paths: []
    # Content-Type allow-list, applied in BOTH directions (case-insensitive prefix match, so
    # "application/json;charset=UTF-8" matches "application/json"):
    #   - request  side (requestCondition bean): a non-matching request with a body drops the WHOLE
    #     audit (request + response) before any buffering; no-body requests (GET/DELETE/probes) pass;
    #   - response side (ContentAwareBodyStrategy): a non-matching response keeps its metadata line but
    #     its BODY is not buffered/logged (can't drop the whole response — the request was already
    #     emitted by then). See docs/logbook-production-tuning.md for the why behind the asymmetry.
    # Empty list disables the content-type gate in both directions (path filtering / status gate only).
    allowed-content-types: [application/json]
    body-on-error:
      # Off by default (dev/test keep full response bodies visible while debugging). Flip to true in
      # production so the response body is buffered/logged only once status >= minimum-status — a
      # genuine buffering skip on the happy path, not just a suppressed log line (see
      # web/ContentAwareBodyStrategy). Composes with allowed-content-types: body kept only when BOTH
      # the content-type matches AND the status gate passes.
      enabled: false
      minimum-status: 500
  https:
    bundle: creed-partner-server
  partner:
    # SSL bundle whose client cert + CA truststore back the @LoadBalanced RestClient's mTLS request
    # factory (see LoadBalancedRestClientConfiguration) used by RemoteClusterProcessor.
    client-bundle: creed-partner-client
  rootPath: ".support/scripts/pki" # relative to the repo root — the process working dir must be the repo root (-Dspring-boot.run.workingDirectory="$PWD" / IDE working dir)