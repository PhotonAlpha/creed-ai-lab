server:
  port: 8096
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  config:
    import: "optional:configserver:"
  application:
    name: creed-simple-metrics
  main:
    # The classic <camelContext> Spring XML registers the <threadPool> beans into the Spring graph,
    # which forms a cycle with camel-spring-boot's health-check registry auto-config
    # (threadPool -> camelContext -> HealthCheckRegistry -> threadPool). Allow it to be broken.
    allow-circular-references: true
  cloud:
    # Static service registry backing Spring Cloud LoadBalancer (no Eureka/Consul). The
    # RemoteClusterProcessor calls https://<service-id>/... and the LB round-robins across these
    # healthy instances (all HTTPS with Creed-CA self-signed certs, trusted via the partner bundle).
    discovery:
      client:
        simple:
          instances:
            catalog-resource:
              - uri: https://localhost:8081
              - uri: https://localhost:8082
            order-resource:
              - uri: https://localhost:8091
              - uri: https://localhost:8092
  ssl:
    bundle:
      jks:
        # Inbound HTTPS listener identity (serverAuth cert).
        creed-partner-server:
          key:
            alias: creed-gateway-partner
          keystore:
            location: "file:${creed.rootPath}/creed-gateway-partner-keystore.p12"
            password: "${CREED_ORDER_KEYSTORE_PASSWORD:changeit}"
            type: PKCS12
          truststore:
            location: "file:${creed.rootPath}/creed-gateway-partner-truststore.p12"
            password: "${CREED_ORDER_TRUSTSTORE_PASSWORD:changeit}"
            type: PKCS12
        # Outbound identity for downstream resource-server calls (clientAuth -CLI cert);
        # truststore trusts the Creed CA so the resource servers' certificates are accepted.
        creed-partner-client:
          key:
            alias: creed-gateway-partner-cli
          keystore:
            location: "file:${creed.rootPath}/creed-gateway-partner-CLI-keystore.p12"
            password: "${CREED_ORDER_KEYSTORE_PASSWORD:changeit}"
            type: PKCS12
          truststore:
            location: "file:${creed.rootPath}/creed-gateway-partner-CLI-truststore.p12"
            password: "${CREED_ORDER_TRUSTSTORE_PASSWORD:changeit}"
            type: PKCS12


# Apache Camel (Spring Boot) configuration.
# All routes/rests/threadPools live in camel-context.xml (classic <camelContext> Spring XML DSL),
# imported via @ImportResource. REST transport + JSON binding + inline-routes are configured there in
# <restConfiguration>; only the servlet mount point is a Spring Boot property.
camel:
  main:
    # Routes come from the inline <camelContext>, so disable camel-spring-boot's file/RouteBuilder
    # collector — otherwise it scans the default classpath:camel/* dirs for route files (and would need
    # camel-xml-io-dsl, which we dropped in favour of camel-spring-xml).
    routes-collector-enabled: false
  servlet:
    mapping:
      # CamelHttpTransportServlet mount point; APIs live under https://host:8096/camel/api/*
      context-path: /camel/*

# Expose the metrics endpoint so the HttpClient 5 pool gauges (httpclient5.pool.connections.*)
# registered in CamelHttpClientConfiguration are visible via actuator.
management:
  endpoints:
    web:
      exposure:
#        include: health,info,metrics,prometheus
        include: "*"
  tracing:
    sampling:
      # Trace every request (Boot defaults to 0.1 = 10%); 1.0 makes trace/span IDs show up in the
      # logs on every call. Lower this in production.
      probability: 1.0
  metrics:
    distribution:
      # Emit http_server_requests_seconds_bucket so the dashboard's HTTP latency panel can use
      # histogram_quantile (p95/p99). Off by default — without this only _count/_sum/_max exist.
      # Camel REST calls (/camel/api/*) flow through the same ServerHttpObservationFilter, so once
      # buckets are on AND CamelRestObservationConvention gives them a real uri, they show up here too.
      percentiles-histogram:
        http.server.requests: true
      # Bound the bucket range so the histogram doesn't generate an excessive number of series.
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 10s

# TomcatHttpsConfiguration (creed.https.enabled=true by default) wires the embedded
# HTTPS listener to the SSL bundle named by `creed.https.bundle`. Outside the `cloud`
# profile no bundle is delivered by the config server, so we define one locally here
# from the service's own PKCS12 keystore/truststore (generated by CA-Generation.sh).
creed:
  https:
    bundle: creed-partner-server
  partner:
    # SSL bundle whose client cert + CA truststore back the @LoadBalanced RestClient's mTLS request
    # factory (see LoadBalancedRestClientConfiguration) used by RemoteClusterProcessor.
    client-bundle: creed-partner-client
  rootPath: "/Users/ethan/Desktop/workspace/sourcecode/github_space/creed-ai-lab/.support/scripts/pki"