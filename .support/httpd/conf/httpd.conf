# Apache HTTP Server 2.4 + mod_proxy_cluster — the balancer creed-simple-metrics registers with.
#
# Three listeners, all TLS:
#   6666  MCMP     — where nodes register (CONFIG / ENABLE-APP / STATUS / INFO …). Mutual TLS: a node
#                    must present a Creed-CA client certificate, which is the only thing that stops
#                    anyone who can reach the port from registering a node and receiving traffic.
#   16666 status   — /mod_cluster_manager for a browser: no client certificate, published on
#                    loopback only (docker-compose.yml). NOT 666x: Chrome/Firefox refuse 6665–6669
#                    outright (IRC, "unsafe port"), without ever opening a connection.
#   9443  traffic  — the public entry point; mod_proxy_cluster routes it to the registered nodes.
#
# The certificates are the repo's PKI (.support/scripts/pki), mounted read-only at /pki.
# This file replaces the image's httpd.conf entirely: only the modules below are loaded.

ServerRoot "/usr/local/apache2"
ServerName creed-httpd
PidFile logs/httpd.pid

LoadModule mpm_event_module      modules/mod_mpm_event.so
LoadModule unixd_module          modules/mod_unixd.so
LoadModule authz_core_module     modules/mod_authz_core.so
LoadModule authz_host_module     modules/mod_authz_host.so
LoadModule log_config_module     modules/mod_log_config.so
LoadModule socache_shmcb_module  modules/mod_socache_shmcb.so
LoadModule ssl_module            modules/mod_ssl.so
# mod_proxy_cluster's dependencies, as upstream's own test configuration loads them.
LoadModule watchdog_module       modules/mod_watchdog.so
LoadModule proxy_module          modules/mod_proxy.so
LoadModule proxy_http_module     modules/mod_proxy_http.so
LoadModule proxy_hcheck_module   modules/mod_proxy_hcheck.so
LoadModule slotmem_shm_module    modules/mod_slotmem_shm.so
# Built from source by the Dockerfile.
LoadModule manager_module        modules/mod_manager.so
LoadModule proxy_cluster_module  modules/mod_proxy_cluster.so

User daemon
Group daemon

ErrorLog /proc/self/fd/2
LogLevel warn manager:info proxy_cluster:info ssl:warn
LogFormat "%h %{SSL_CLIENT_S_DN_CN}x \"%r\" %>s %b %Dus" mcmp
LogFormat "%h \"%r\" %>s %b %Dus -> %{BALANCER_WORKER_NAME}e" traffic

SSLSessionCache shmcb:logs/ssl_scache(512000)
SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLRandomSeed startup builtin

# httpd → node TLS. The node registers Type=https (its Tomcat connector), so every request httpd
# forwards is TLS, verified against the Creed CA.
#
# These MUST be at server level, not inside the 9443 VirtualHost: mod_proxy_cluster creates the node
# workers (and pings them) on the main server, so a vhost-scoped SSLProxyEngine never applies — the
# node registers fine, then shows Status: NOTOK and every request is a 503 with
# "AH01961: failed to enable ssl support".
#
# The name check is off because the node is reached by the Docker host-gateway IP, which its
# certificate (creed-gateway-partner: DNS creed-gateway-partner / localhost) does not name. The chain
# is still verified.
SSLProxyEngine on
SSLProxyCACertificateFile /pki/ca-chain.crt
SSLProxyVerify require
SSLProxyVerifyDepth 2
SSLProxyCheckPeerName off

# Must match creed.mod-cluster.balancer.name.
ManagerBalancerName mycluster
# The node's cookie is Tomcat's JSESSIONID; keep the Host header so Tomcat sees the public host.
ProxyPreserveHost On

# --------------------------------------------------------------------------- MCMP (node → httpd)
Listen 6666
<VirtualHost *:6666>
    ServerName creed-httpd:6666
    CustomLog /proc/self/fd/1 mcmp

    SSLEngine on
    SSLCertificateFile    /pki/creed-httpd.crt
    SSLCertificateKeyFile /pki/creed-httpd.key
    SSLCertificateChainFile /pki/ca-chain.crt
    # Mutual TLS: only a certificate issued by the Creed CA may register a node. The node presents
    # its outbound identity (creed-gateway-partner-CLI) — see creed.mod-cluster.ssl.* in the module.
    SSLCACertificateFile  /pki/ca-chain.crt
    SSLVerifyClient require
    SSLVerifyDepth  2

    # MCMP arrives at "/" of this VirtualHost — NOT at /mod_cluster_manager (that is the human page).
    EnableMCMPReceive

    <Location />
        # The client certificate above is the access control; the docker port-forward means the
        # source address is the bridge gateway, not the node, so an IP rule would say nothing.
        Require all granted
    </Location>

    # The node table is here too, for scripts that already hold a client certificate (curl
    # --cert/--key). Browsers use the 16666 listener below instead.
    <Location /mod_cluster_manager>
        SetHandler mod_cluster-manager
        Require all granted
    </Location>
</VirtualHost>

# --------------------------------------------------------------------------- status page (browser)
# The same mod_cluster_manager page for a browser. Two reasons it cannot be 6666:
#   - browsers block 6665–6669 as unsafe (IRC) ports and never even connect (ERR_UNSAFE_PORT);
#   - 6666 needs a Creed client certificate, which a browser does not have.
# So: no client certificate, and a port outside the blocked range. The page can Disable/Stop
# contexts, so docker-compose publishes it on loopback only.
Listen 16666
<VirtualHost *:16666>
    ServerName creed-httpd:16666
    CustomLog /proc/self/fd/1 traffic

    SSLEngine on
    SSLCertificateFile    /pki/creed-httpd.crt
    SSLCertificateKeyFile /pki/creed-httpd.key
    SSLCertificateChainFile /pki/ca-chain.crt

    <Location /mod_cluster_manager>
        SetHandler mod_cluster-manager
        Require all granted
    </Location>
</VirtualHost>

# --------------------------------------------------------------------------- traffic (client → node)
Listen 9443
<VirtualHost *:9443>
    ServerName localhost
    CustomLog /proc/self/fd/1 traffic

    SSLEngine on
    SSLCertificateFile    /pki/creed-httpd.crt
    SSLCertificateKeyFile /pki/creed-httpd.key
    SSLCertificateChainFile /pki/ca-chain.crt
</VirtualHost>
