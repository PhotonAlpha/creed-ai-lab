server:
  port: 9000
  servlet:
    context-path: /auth-server
  tomcat:
    mbeanregistry:
      enabled: true
spring:
  application:
    name: creed-author-server
  # Trust material for the outbound HttpClient5 RestTemplate that calls creed-gateway over HTTPS.
  # creed-gateway presents a self-signed server cert (CN=localhost) issued by the dev CA bundled in
  # truststore.p12 (password "changeit"). We only need to TRUST the gateway here, so no key entry.
  ssl:
    bundle:
      jks:
        creed-gateway-trust:
          truststore:
            location: "classpath:certs/truststore.p12"
            password: "${CREED_GATEWAY_TRUSTSTORE_PASSWORD:changeit}"
            type: PKCS12

logging:
  file:
    # 日志输出目录,logback-spring.xml 据此分别写出业务日志与指标日志
    path: ./logs
  level:
    # OTel SDK exporter 的日志级别。SDK 内部用 JUL 写日志,Spring Boot 把它桥到 SLF4J:
    # JUL FINE -> SLF4J DEBUG,FINER/FINEST -> TRACE。成功批次基本都打在 FINE/FINER,
    # 失败才会到 WARNING/SEVERE,所以想看到每批推送的时机必须开到 TRACE。生产改回 INFO。
#    io.opentelemetry.exporter: TRACE
#    io.opentelemetry.sdk.trace.export: TRACE
    io.opentelemetry.sdk.metrics.export: TRACE
#    io.opentelemetry.sdk.logs.export: TRACE

creed:
  # Outbound HttpClient5 RestTemplate -> creed-gateway (HTTPS). See GatewayRestTemplateConfiguration.
  gateway:
    base-url: ${CREED_GATEWAY_BASE_URL:https://localhost:8080}
    ssl-bundle: creed-gateway-trust
    connect-timeout: 5s
    read-timeout: 10s
    # Connection pool sizing — exposed as httpcomponents.httpclient.pool.* metrics.
    max-total-connections: 50
    max-connections-per-route: 20
  auth:
    # OAuth2/OIDC issuer. MUST include the context-path above so it equals the URL where the
    # discovery document is served (<issuer>/.well-known/openid-configuration). Resource servers
    # and the gateway must use this exact value as their jwt.issuer-uri.
    issuer: ${CREED_AUTH_ISSUER:http://127.0.0.1:9000/auth-server}
  # `optional:` so local dev still boots when the config server is down.
  # Drop the prefix in prod / CI to fail-fast on misconfiguration.
#  config:
#    import: "${CREED_CONFIG_IMPORT:optional:configserver:https://localhost:8443/config-server}"
#  cloud:
#    config:
#      username: ${CREED_CONFIG_USER:creed-config}
#      password: ${CREED_CONFIG_PASSWORD:configpass}
#      fail-fast: false
#      # Re-use the SSL Bundle defined below to trust the config server's self-signed cert.
#      # Comment this out if the config server runs over plain HTTP.
#      tls:
#        enabled: true
#        bundle: creed-config-trust
#  ssl:
#    bundle:
#      pem:
#        creed-config-trust:
#          truststore:
#            certificate: "${CREED_CONFIG_TRUST_CERT:classpath:certs/ca.crt}"

management:
  health:
    defaults:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
    jmx:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.95, 0.99
    # Micrometer→OTel 桥接(otel.instrumentation.micrometer.enabled=true)会把整个 Micrometer
    # 注册表桥到 OTLP。JVM/system/process 指标 OTel 原生埋点已经产出(jvm_memory_used_bytes 等),
    # 这里关掉 Micrometer 侧的同名 binder,避免在 collector 里出现重名但标签不同的重复序列。
    # Tomcat、logback 等 OTel 原生没有的指标仍由 Micrometer 提供。
    enable:
      jvm: false
      system: false
      process: false
  # Micrometer-side sampling probability for the OTel bridge. Set to 0.0 to stop
  # recording any spans (链路追踪关闭)。otel.traces.exporter=none below also disables export.
  tracing:
    sampling:
      probability: ${CREED_OTEL_SAMPLE_RATE:0.0}

# ============ OpenTelemetry ============
# Read by opentelemetry-spring-boot-starter; configures traces, metrics and logs in one place.
# Override CREED_OTEL_ENDPOINT (e.g. http://otel-collector:4318) per environment.
otel:
  # OTel 原生埋点(runtime-telemetry / spring-webmvc)不产出 Tomcat 指标。开启 Micrometer→OTel
  # 桥接,把 Spring/Micrometer 独有的指标(Tomcat 线程池、会话、logback 等)经 OTLP 上报。
  # 需配合 server.tomcat.mbeanregistry.enabled=true 才能让 TomcatMetrics binder 注册。
  instrumentation:
    micrometer:
      enabled: true
  service:
    name: ${spring.application.name}
  resource:
    attributes:
      service.name: ${spring.application.name}
      service.namespace: creed
      deployment.environment: ${CREED_ENV:local}
      # 不设置时 OTel SDK 每次启动随机生成一个 UUID 作为 service.instance.id,
      # 导致 collector 的 instance 标签每次重启都变,Grafana 下拉框堆积死实例。
      # 固定为 服务名:端口,单实例本地开发下稳定且足够区分。多副本部署请改成每实例唯一值。
      service.instance.id: ${spring.application.name}:${server.port}
  # 多导出器以逗号分隔。`logging` 是 SDK 自带的 LoggingExporter,会在每批信号导出前
  # 把它们以可读格式打印到 stdout——是最直观的“OTLP 推送时机/内容”观察手段。
  # 当前只保留 metrics:traces / logs 的 exporter 设为 none,完全不采集、不上报。
  traces:
    exporter: none
    sampler: parentbased_always_on
  metrics:
#    exporter: none
    exporter: otlp,logging
  logs:
    exporter: none
  exporter:
    otlp:
      endpoint: ${CREED_OTEL_ENDPOINT:http://localhost:4318}
      protocol: http/protobuf
      compression: gzip
      timeout: 60s
  metric:
    export:
      interval: 10000

